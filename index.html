<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS Summaries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Assistant:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ========== RESET & TOKENS ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #fdfbf0;
      --bg-panel:  #faf6e0;
      --bg-card:   #ffffff;
      --bg-hover:  #f5eecc;
      --border:    rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.15);
      --text:      #1c1917;
      --text-muted:#78716c;
      --text-dim:  #b5a98e;
      --accent:    #1d4ed8;
      --accent-bg: rgba(29,78,216,0.08);
      --green:     #15803d;
      --green-bg:  rgba(21,128,61,0.08);
      --amber:     #b45309;
      --amber-bg:  rgba(180,83,9,0.08);
      --red:       #b91c1c;
      --red-bg:    rgba(185,28,28,0.08);
      --purple:    #6d28d9;
      --purple-bg: rgba(109,40,217,0.08);
      --sidebar-w: 240px;
      --topbar-h:  56px;
      --radius:    8px;
      --radius-lg: 12px;
      --font-ui:   'Assistant', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-serif:'Noto Serif Hebrew', serif;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ========== TOP BAR ========== */
    #topbar {
      height: var(--topbar-h);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .logo span {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 13px;
    }

    .logo small {
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.03em;
    }

    #topbar-search {
      flex: 1;
      max-width: 340px;
      position: relative;
    }

    #search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 36px 7px 14px;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--text-dim); }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 14px;
      pointer-events: none;
    }

    .topbar-stats {
      margin-right: auto;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
    }

    .topbar-stats span { white-space: nowrap; }

    /* ========== LAYOUT ========== */
    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ========== SIDEBAR ========== */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-section-label {
      padding: 14px 14px 6px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    #course-list { overflow-y: auto; flex: 1; padding: 4px 8px 8px; }

    .course-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 2px;
      border: 1px solid transparent;
    }

    .course-item:hover { background: var(--bg-hover); color: var(--text); }

    .course-item.active {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: rgba(88,166,255,0.2);
    }

    .course-icon { font-size: 16px; flex-shrink: 0; }

    .course-count {
      margin-right: auto;
      font-size: 10px;
      background: var(--bg-card);
      padding: 1px 6px;
      border-radius: 10px;
      color: var(--text-dim);
    }

    .course-item.active .course-count {
      background: rgba(88,166,255,0.15);
      color: var(--accent);
    }

    /* ========== MAIN AREA ========== */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    /* ========== COURSE HEADER ========== */
    #course-header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px 0;
      flex-shrink: 0;
    }

    #course-title-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    #course-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    #course-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-right: auto;
    }

    /* ========== TOPIC TABS ========== */
    #topic-tabs {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #topic-tabs::-webkit-scrollbar { display: none; }

    .topic-tab {
      padding: 8px 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-family: var(--font-ui);
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }

    .topic-tab:hover { color: var(--text); }

    .topic-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 500;
    }

    /* ========== CONTENT AREA ========== */
    #content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }

    #content-area::-webkit-scrollbar { width: 6px; }
    #content-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    /* ========== CONTENT CARDS ========== */
    .content-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      margin-bottom: 14px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .card-title { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--text); }
    .card-tags { display: flex; gap: 5px; flex-wrap: wrap; flex-shrink: 0; }

    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .tag-blue   { background: var(--accent-bg);  color: var(--accent); }
    .tag-green  { background: var(--green-bg);   color: var(--green); }
    .tag-amber  { background: var(--amber-bg);   color: var(--amber); }
    .tag-red    { background: var(--red-bg);     color: var(--red); }
    .tag-purple { background: var(--purple-bg);  color: var(--purple); }

    .card-body { font-size: 15px; line-height: 1.85; color: var(--text-muted); }
    .card-body p { margin-bottom: 10px; }
    .card-body p:last-child { margin-bottom: 0; }

    .card-body code {
      font-family: var(--font-mono);
      font-size: 13px;
      background: rgba(109,40,217,0.07);
      padding: 2px 7px;
      border-radius: 4px;
      color: var(--purple);
      font-weight: 500;
    }

    /* בלוק נוסחה — שורה עצמאית */
    .card-body p.formula {
      font-family: var(--font-mono);
      font-size: 15px;
      text-align: center;
      padding: 9px 16px;
      background: #fff0e4;
      border-right: 3px solid #e8894a;
      border-radius: 6px 0 0 6px;
      color: #c2601a;
      font-weight: 500;
      margin: 6px 0;
      letter-spacing: 0.01em;
      direction: ltr;
    }

    .card-body sub, .card-body sup { font-size: 0.72em; }
    .card-body strong { color: var(--text); font-weight: 600; }

    .card-divider { height: 1px; background: var(--border); margin: 12px 0; }

    .complexity-row { display: flex; gap: 6px; flex-wrap: wrap; }

    .complexity-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: var(--bg-hover);
    }

    /* ========== EMPTY STATE ========== */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--text-dim);
    }

    #empty-state svg { opacity: 0.3; }
    #empty-state p { font-size: 14px; }

    /* ========== SEARCH HIGHLIGHT ========== */
    mark { background: rgba(210,153,34,0.25); color: var(--amber); border-radius: 2px; }

    /* ========== PDF VIEWER ========== */
    #pdf-frame { width: 100%; height: 100%; border: none; display: block; background: #525659; }
    .view-toggle { display: flex; gap: 2px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px; margin-right: auto; margin-bottom: 10px; flex-shrink: 0; }
    .view-toggle-btn { padding: 4px 12px; border: none; background: transparent; border-radius: 5px; cursor: pointer; font-size: 12px; font-family: var(--font-ui); color: var(--text-muted); transition: all 0.15s; white-space: nowrap; }
    .view-toggle-btn.active { background: var(--bg-hover); color: var(--text); }

    /* ========== SCROLLBAR ========== */
    #course-list::-webkit-scrollbar { width: 4px; }
    #course-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

    /* ========== FLASHCARDS ========== */
    .flashcards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .flashcard {
      background: transparent;
      height: 220px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .flashcard.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-front, .flashcard-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .flashcard-front {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .flashcard-back {
      background-color: var(--bg-panel);
      border: 2px solid var(--accent);
      color: var(--text);
      transform: rotateY(180deg);
      font-size: 14px;
      line-height: 1.6;
      text-align: right;
      overflow-y: auto;
    }

    .flashcard-back::-webkit-scrollbar { width: 4px; }
    .flashcard-back::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 640px) {
      :root { --sidebar-w: 200px; }
      #course-title { font-size: 15px; }
      #content-area { padding: 16px; }
    }
  </style>
</head>
<body>

  <div id="topbar">
    <div class="logo">CS Summaries<small>by Yuli Ittah</small></div>
    <div id="topbar-search">
      <span class="search-icon">⌕</span>
      <input type="text" id="search-input" placeholder="חיפוש בכל הסיכומים..." />
    </div>
    <div class="topbar-stats">
      <span id="stat-courses"></span>
      <span id="stat-topics"></span>
    </div>
  </div>

  <div id="layout">

    <div id="sidebar">
      <div class="sidebar-section-label">קורסים</div>
      <div id="course-list"></div>
    </div>

    <div id="main">
      <div id="course-header">
        <div id="course-title-bar">
          <div id="course-title">בחר קורס</div>
          <div id="course-subtitle"></div>
        </div>
        <div id="topic-tabs"></div>
      </div>
      <div id="content-area">
        <div id="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
          </svg>
          <p>בחר קורס מהתפריט הצדדי</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ================================================================
    // DATA — ערוך כאן את הקורסים והסיכומים שלך
    // כל קורס מכיל: name, icon (emoji), topics
    // כל נושא מכיל מערך של content cards
    // כל card: title, tags, text, complexity (אופציונלי)
    // ================================================================

    const COURSES = {
      mixed_defs: {
        name: "מרתון הגדרות",
        icon: "🧠",
        topics: {
          "מיקס: לינארית ואינפי": {
            content: [
              // ==========================================
              // הגדרות אינפי 1
              // ==========================================
              {
                title: "התכנסות סדרה לפי קושי",
                tags: [{ label: "אינפי", color: "purple" }, { label: "משפט", color: "amber" }],
                text: `<p>סדרה (a<sub>n</sub>) מתכנסת במובן הצר <strong>אם ורק אם</strong> היא סדרת קושי.</p>
                <p>הגדרה לסדרת קושי: לכל ε&gt;0 קיים N כך שלכל m,n&gt;N מתקיים:</p>
                <p class="formula">|a<sub>n</sub> - a<sub>m</sub>| &lt; ε</p>`
              },
              {
                title: "נגזרת של פונקציה",
                tags: [{ label: "אינפי", color: "purple" }, { label: "הגדרה", color: "blue" }],
                text: `<p>הנגזרת של פונקציה f בנקודה a היא הגבול של קצב השינוי:</p>
                <p class="formula">f'(a) = lim<sub>h→0</sub> [f(a+h) − f(a)] / h</p>
                <p>אם הגבול קיים וסופי, הפונקציה <strong>גזירה</strong> ב-a (וזה גם גורר רציפות בנקודה).</p>`
              },
              {
                title: "נגזרת של פונקציה הפיכה",
                tags: [{ label: "אינפי", color: "purple" }],
                text: `<p>תהי f פונקציה גזירה והפיכה, ונניח ש- f'(x) ≠ 0. אזי הפונקציה ההפוכה f<sup>-1</sup> גזירה, ומתקיים:</p>
                <p class="formula">(f<sup>-1</sup>)'(y) = 1 / f'(f<sup>-1</sup>(y))</p>
                <p>כלומר, הנגזרת של ההפוכה היא ההופכי של הנגזרת (בערך המתאים).</p>`
              },
              {
                title: "התכנסות סדרה לאינסוף",
                tags: [{ label: "אינפי", color: "purple" }, { label: "הגדרה", color: "blue" }],
                text: `<p>סדרה (a<sub>n</sub>) שואפת לאינסוף אם לכל חסם שנקבע, הסדרה תעבור אותו בשלב מסוים. פורמלית:</p>
                <p>לכל M &gt; 0 (גדול ככל שיהיה), קיים N כך שלכל n &gt; N מתקיים:</p>
                <p class="formula">a<sub>n</sub> &gt; M</p>`
              },
              {
                title: "משפט ערך הביניים",
                tags: [{ label: "אינפי", color: "purple" }, { label: "משפט", color: "amber" }],
                text: `<p>אם פונקציה f <strong>רציפה</strong> בקטע סגור [a,b], אז היא מקבלת כל ערך בין f(a) ל-f(b).</p>
                <p>בפרט (למציאת שורשים): אם f(a) ו-f(b) בעלי סימנים מנוגדים (למשל f(a)&lt;0 ו-f(b)&gt;0), אז קיים c∈(a,b) כך ש- f(c)=0.</p>`
              },
              {
                title: "משפט ויירשטראס 1 (חסימות)",
                tags: [{ label: "אינפי", color: "purple" }, { label: "משפט", color: "amber" }],
                text: `<p>תהי f פונקציה <strong>רציפה</strong> בקטע סגור וחסום [a,b].</p>
                <p>אזי f <strong>חסומה</strong> בקטע זה.</p>`
              },
              {
                title: "משפט ויירשטראס 2 (ערך קיצון)",
                tags: [{ label: "אינפי", color: "purple" }, { label: "משפט", color: "amber" }],
                text: `<p>תהי f פונקציה <strong>רציפה</strong> בקטע סגור וחסום [a,b].</p>
                <p>אזי קיימות נקודות c,d בקטע [a,b] כך ש- f(c) הוא מקסימום מוחלט ו- f(d) מינימום מוחלט של f בקטע.</p>`
              },
              {
                title: "התכנסות בהחלט",
                tags: [{ label: "אינפי", color: "purple" }, { label: "הגדרה", color: "blue" }],
                text: `<p>נאמר שטור Σa<sub>n</sub> מתכנס בהחלט, אם הטור של הערכים המוחלטים שלו מתכנס:</p>
                <p class="formula">Σ|a<sub>n</sub>| &lt; ∞</p>
                <p><strong>משפט:</strong> התכנסות בהחלט גוררת התכנסות (כלומר, אם Σ|a<sub>n</sub>| מתכנס, אז גם Σa<sub>n</sub> מתכנס).</p>`
              },
              {
                title: "רציפות בנקודה",
                tags: [{ label: "אינפי", color: "purple" }, { label: "הגדרה", color: "blue" }],
                text: `<p>פונקציה f נקראת <strong>רציפה</strong> בנקודה a (בסביבת הגדרתה) אם הגבול של הפונקציה בנקודה שווה לערך הפונקציה בנקודה:</p>
                <p class="formula">lim<sub>x→a</sub> f(x) = f(a)</p>
                <p>זה אומר שגם הגבול הימני וגם השמאלי שווים ל-f(a).</p>`
              },
              {
                title: "גזירות בנקודה",
                tags: [{ label: "אינפי", color: "purple" }, { label: "הגדרה", color: "blue" }],
                text: `<p>פונקציה f נקראת <strong>גזירה</strong> בנקודה a אם הגבול של מנת ההפרשים (הנגזרת) בנקודה קיים וסופי.</p>
                <p><strong>משפט חשוב:</strong> גזירות בנקודה גוררת רציפות באותה נקודה. (ההיפך אינו נכון, למשל הפונקציה |x| רציפה באפס אך אינה גזירה שם).</p>`
              },

              // ==========================================
              // הגדרות לינארית 1
              // ==========================================
              {
                title: "העתקה לינארית",
                tags: [{ label: "לינארית", color: "blue" }, { label: "הגדרה", color: "blue" }],
                text: `<p>פונקציה <strong>T: V→U</strong> (ממרחב וקטורי V ל-U) היא העתקה לינארית אם היא שומרת על פעולות המרחב (לכל u,v∈V וסקלר λ):</p>
                <p class="formula">T(u+v) = T(u) + T(v)</p>
                <p class="formula">T(λv) = λ·T(v)</p>`
              },
              {
                title: "משפט המימדים (לתת-מרחבים)",
                tags: [{ label: "לינארית", color: "blue" }, { label: "משפט", color: "amber" }],
                text: `<p>יהיו U,W תתי-מרחבים של מרחב וקטורי V מממד סופי. אזי:</p>
                <p class="formula">dim(U+W) = dim(U) + dim(W) − dim(U ∩ W)</p>`
              },
              {
                title: "משפט הדרגה (מטריצות)",
                tags: [{ label: "לינארית", color: "blue" }, { label: "משפט", color: "amber" }],
                text: `<p>לכל מטריצה A, <strong>דרגת השורות שווה לדרגת העמודות</strong>.</p>
                <p>במילים אחרות: הממד של מרחב השורות שווה לממד של מרחב העמודות, ומסומן כ- Rank(A).</p>
                <p class="formula">rank(A) = rank(A<sup>T</sup>)</p>`
              },
              {
                title: "משפט הדרגה להעתקות לינאריות",
                tags: [{ label: "לינארית", color: "blue" }, { label: "משפט", color: "amber" }],
                text: `<p>תהי T: V→U העתקה לינארית, ו-V בעל ממד סופי. אזי, סכום ממדי הגרעין (Ker) והתמונה (Im) שווה לממד תחום ההגדרה (V):</p>
                <p class="formula">dim(Ker(T)) + dim(Im(T)) = dim(V)</p>`
              },
              {
                title: "תת-מרחב של מרחב וקטורי",
                tags: [{ label: "לינארית", color: "blue" }, { label: "הגדרה", color: "blue" }],
                text: `<p>קבוצה W שהיא תת-קבוצה של מרחב וקטורי V, תקרא תת-מרחב שלו אם מתקיימים 3 תנאים (קריטריון תת-מרחב):</p>
                <ol style="padding-right: 20px;">
                  <li>W אינה ריקה (לרוב בודקים שוקטור ה-0 שייך אליה).</li>
                  <li>סגירות לחיבור: לכל u,w ∈ W גם u+w ∈ W.</li>
                  <li>סגירות לכפל בסקלר: לכל w ∈ W וסקלר λ, גם λw ∈ W.</li>
                </ol>`
              },
              {
                title: "וקטור קואורדינטות",
                tags: [{ label: "לינארית", color: "blue" }, { label: "הגדרה", color: "blue" }],
                text: `<p>יהי B={v<sub>1</sub>,...,v<sub>n</sub>} בסיס ל-V. לכל v∈V קיימים סקלרים <strong>יחידים</strong> כך ש v = a<sub>1</sub>v<sub>1</sub>+...+a<sub>n</sub>v<sub>n</sub>.</p>
                <p>וקטור הקואורדינטות של v לפי הבסיס B הוא וקטור עמודה ב- F<sup>n</sup> שאיבריו הם הסקלרים הללו:</p>
                <p class="formula">[v]<sub>B</sub> = (a<sub>1</sub>, a<sub>2</sub>, ..., a<sub>n</sub>)<sup>T</sup></p>`
              },
              {
                title: "מטריצה מייצגת העתקה",
                tags: [{ label: "לינארית", color: "blue" }, { label: "הגדרה", color: "blue" }],
                text: `<p>תהי T: V→U, יהי B={v<sub>1</sub>,...,v<sub>n</sub>} בסיס ל-V, ו-C בסיס ל-U.</p>
                <p>המטריצה המייצגת [T]<sub>B</sub><sup>C</sup> נבנית כך: עמודה j שלה היא וקטור הקואורדינטות של מופעלת T על איבר הבסיס ה-j, לפי בסיס C:</p>
                <p class="formula">Col<sub>j</sub> = [T(v<sub>j</sub>)]<sub>C</sub></p>`
              },
              {
                title: "משפט ההגדרה להעתקות לינאריות",
                tags: [{ label: "לינארית", color: "blue" }, { label: "משפט", color: "amber" }],
                text: `<p>כדי להגדיר העתקה לינארית, מספיק לדעת מה היא עושה לאיברי בסיס.</p>
                <p>אם B={v<sub>1</sub>,...,v<sub>n</sub>} הוא בסיס ל-V, ו- {w<sub>1</sub>,...,w<sub>n</sub>} הם וקטורים <strong>כלשהם</strong> ב-U, קיימת העתקה לינארית <strong>אחת ויחידה</strong> המקיימת:</p>
                <p class="formula">T(v<sub>i</sub>) = w<sub>i</sub> לכל i</p>`
              },
              {
                title: "מרחב וקטורי",
                tags: [{ label: "לינארית", color: "blue" }, { label: "הגדרה", color: "blue" }],
                text: `<p>קבוצה V מעל שדה סקלרים F, יחד עם פעולת חיבור ופעולת כפל בסקלר, המקיימת 8 אקסיומות:</p>
                <p>סגירות לחיבור וכפל בסקלר, קיבוציות (אסוציאטיביות), חילופיות (קומוטטיביות) בחיבור, קיום איבר ניטרלי (0), קיום איבר נגדי (-v), וכללי פילוג (דיסטריבוטיביות).</p>`
              },
              {
                title: "הגדרה של בסיס",
                tags: [{ label: "לינארית", color: "blue" }, { label: "הגדרה", color: "blue" }],
                text: `<p>קבוצה <strong>B = {v<sub>1</sub>,...,v<sub>n</sub>}</strong> היא בסיס של מרחב וקטורי V אם היא מקיימת שני תנאים:</p>
                <ol style="padding-right: 20px;">
                  <li>היא <strong>פורשת</strong> את המרחב (כל וקטור במרחב ניתן להצגה כצירוף לינארי שלה).</li>
                  <li>היא <strong>בלתי תלויה לינארית</strong> (בת"ל).</li>
                </ol>`
              },
              {
                title: "משפט שלישי חינם",
                tags: [{ label: "לינארית", color: "blue" }, { label: "משפט", color: "amber" }],
                text: `<p>יהי V מרחב ממימד n, ותהי S תת-קבוצה של V בעלת n איברים בדיוק (|S|=n).</p>
                <p>אז שני תנאים שקולים (וכל אחד מהם גורר ש-S בסיס):</p>
                <ol style="padding-right: 20px;">
                  <li>S קבוצה בלתי תלויה לינארית (בת"ל).</li>
                  <li>S פורשת את המרחב V.</li>
                </ol>
                <p>כלומר: מספיק לבדוק תנאי אחד (בת"ל <strong>או</strong> פורשת) אם ידוע שהגודל נכון!</p>`
              }
            ]
          }
        }
      },
    };
    // ================================================================
    // STATE
    // ================================================================
    let activeCourse = null;
    let activeTopic = null;
    let searchQuery = '';
    let viewMode = 'cards'; // 'cards' | 'pdf' | 'flashcards'
    let activePdfIndex = 0;
    const pdfBlobUrls = {}; // "courseId:index" → blob URL

    // ================================================================
    // TAG COLOR MAP
    // ================================================================
    const tagColorMap = {
      "בסיסי": "blue", "חשוב": "amber", "מבחן": "green",
      "מתקדם": "purple", "יעיל": "blue", "LIFO": "blue",
      "FIFO": "blue", "D&C": "purple", "לינארי": "red",
      "קלאסי": "blue", "מאוזן": "purple", "מהיר": "blue",
      "אמין": "green",
    };

    // ================================================================
    // RENDER HELPERS
    // ================================================================
    function renderTag(tag) {
      const color = tag.color || tagColorMap[tag.label] || 'blue';
      return `<span class="tag tag-${color}">${tag.label}</span>`;
    }

    function renderCard(card) {
      const tags = (card.tags || []).map(renderTag).join('');
      const pills = (card.complexity || [])
        .map(c => `<span class="complexity-pill">${c}</span>`).join('');
      const body = card.text || '';
      return `
        <div class="content-card">
          <div class="card-header">
            <div class="card-title">${highlight(card.title)}</div>
            <div class="card-tags">${tags}</div>
          </div>
          <div class="card-body">${searchQuery ? highlightBody(body) : body}</div>
          ${pills ? `<div class="card-divider"></div><div class="complexity-row">${pills}</div>` : ''}
        </div>`;
    }

    function highlight(text) {
      if (!searchQuery) return text;
      const re = new RegExp(`(${escapeRe(searchQuery)})`, 'gi');
      return text.replace(re, '<mark>$1</mark>');
    }

    function highlightBody(html) {
      if (!searchQuery) return html;
      // Only highlight text nodes, not tags
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      highlightNode(tmp);
      return tmp.innerHTML;
    }

    function highlightNode(node) {
      if (node.nodeType === 3) {
        const re = new RegExp(`(${escapeRe(searchQuery)})`, 'gi');
        if (re.test(node.textContent)) {
          const span = document.createElement('span');
          span.innerHTML = node.textContent.replace(re, '<mark>$1</mark>');
          node.parentNode.replaceChild(span, node);
        }
      } else {
        Array.from(node.childNodes).forEach(highlightNode);
      }
    }

    function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    // ================================================================
    // RENDER SIDEBAR
    // ================================================================
    function renderSidebar() {
      const list = document.getElementById('course-list');
      list.innerHTML = '';
      let courseCount = 0;
      let topicCount = 0;

      Object.entries(COURSES).forEach(([id, course]) => {
        if (searchQuery) {
          // check if query matches course name or any topic/content
          const match = courseMatches(id, course);
          if (!match) return;
        }

        courseCount++;
        topicCount += Object.keys(course.topics).length;

        const item = document.createElement('div');
        item.className = 'course-item' + (activeCourse === id ? ' active' : '');
        const topicNum = Object.keys(course.topics).length;
        item.innerHTML = `<span class="course-icon">${course.icon}</span>${course.name}<span class="course-count">${topicNum}</span>`;
        item.onclick = () => selectCourse(id);
        list.appendChild(item);
      });

      document.getElementById('stat-courses').textContent = `${courseCount} קורסים`;
      document.getElementById('stat-topics').textContent = `${topicCount} נושאים`;
    }

    function courseMatches(id, course) {
      if (course.name.includes(searchQuery)) return true;
      for (const [topic, data] of Object.entries(course.topics)) {
        if (topic.includes(searchQuery)) return true;
        for (const card of (data.content || [])) {
          if (card.title.includes(searchQuery)) return true;
          if ((card.text || '').includes(searchQuery)) return true;
        }
      }
      return false;
    }

    // ================================================================
    // SELECT COURSE
    // ================================================================
    function selectCourse(id) {
      activeCourse = id;
      activeTopic = Object.keys(COURSES[id].topics)[0];
      activePdfIndex = 0;
      const c = COURSES[id];
      viewMode = (c.pdfs || c.pdf) ? 'pdf' : 'cards';
      render();
    }

    // ================================================================
    // RENDER MAIN
    // ================================================================
    function renderMain() {
      const titleEl = document.getElementById('course-title');
      const subtitleEl = document.getElementById('course-subtitle');
      const tabsEl = document.getElementById('topic-tabs');
      const contentEl = document.getElementById('content-area');

      if (!activeCourse) {
        titleEl.textContent = 'בחר קורס';
        subtitleEl.textContent = '';
        tabsEl.innerHTML = '';
        contentEl.innerHTML = `<div id="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/>
          </svg>
          <p>בחר קורס מהתפריט הצדדי</p>
        </div>`;
        return;
      }

      const course = COURSES[activeCourse];
      titleEl.textContent = `${course.icon} ${course.name}`;
      subtitleEl.textContent = `${Object.keys(course.topics).length} נושאים`;

      // Build header: toggle (if pdf/pdfs exists) + tabs/pdf-subtabs
      tabsEl.innerHTML = '';
      const hasPdfs = course.pdfs || course.pdf;

      if (hasPdfs) {
        const toggle = document.createElement('div');
        toggle.className = 'view-toggle';
        toggle.innerHTML = `
          <button class="view-toggle-btn ${viewMode === 'pdf' ? 'active' : ''}" id="btn-pdf">📄 PDF</button>
          <button class="view-toggle-btn ${viewMode === 'cards' ? 'active' : ''}" id="btn-cards">🗂 סיכומים</button>
          <button class="view-toggle-btn ${viewMode === 'flashcards' ? 'active' : ''}" id="btn-flashcards">🔁 Flashcards</button>
        `;
        toggle.querySelector('#btn-pdf').onclick = () => { viewMode = 'pdf'; renderMain(); };
        toggle.querySelector('#btn-cards').onclick = () => { viewMode = 'cards'; renderMain(); };
        toggle.querySelector('#btn-flashcards').onclick = () => { viewMode = 'flashcards'; renderMain(); };
        tabsEl.appendChild(toggle);
      }

      if (viewMode === 'pdf' && course.pdfs && course.pdfs.length > 1) {
        // Sub-tabs for multiple PDFs
        course.pdfs.forEach((p, i) => {
          const tab = document.createElement('button');
          tab.className = 'topic-tab' + (activePdfIndex === i ? ' active' : '');
          tab.textContent = p.label;
          tab.onclick = () => { activePdfIndex = i; renderContent(); updatePdfTabs(); };
          tabsEl.appendChild(tab);
        });
      } else if (viewMode === 'cards' || viewMode === 'flashcards') {
        Object.keys(course.topics).forEach(topic => {
          const tab = document.createElement('button');
          tab.className = 'topic-tab' + (activeTopic === topic ? ' active' : '');
          tab.textContent = topic;
          tab.onclick = () => { activeTopic = topic; renderContent(); updateTabs(); };
          tabsEl.appendChild(tab);
        });
      }

      renderContent();
    }

    function hideTabs() {
      document.querySelectorAll('.topic-tab').forEach(t => t.remove());
    }

    function updateTabs() {
      document.querySelectorAll('.topic-tab').forEach((tab, i) => {
        const topics = Object.keys(COURSES[activeCourse].topics);
        tab.className = 'topic-tab' + (topics[i] === activeTopic ? ' active' : '');
      });
    }

    function updatePdfTabs() {
      document.querySelectorAll('.topic-tab').forEach((tab, i) => {
        tab.className = 'topic-tab' + (activePdfIndex === i ? ' active' : '');
      });
    }

    function getPdfEntry() {
      const course = COURSES[activeCourse];
      if (course.pdfs) return course.pdfs[activePdfIndex];
      if (course.pdf) return { label: 'PDF', file: course.pdf };
      return null;
    }

    function renderContent() {
      const contentEl = document.getElementById('content-area');
      const course = COURSES[activeCourse];

      // PDF mode
      if (viewMode === 'pdf') {
        const entry = getPdfEntry();
        if (!entry) return;
        contentEl.style.padding = '0';
        const key = `${activeCourse}:${activePdfIndex}`;

        if (pdfBlobUrls[key]) {
          contentEl.innerHTML = `<iframe id="pdf-frame" src="${pdfBlobUrls[key]}" title="${entry.label}"></iframe>`;
        } else if (location.protocol !== 'file:') {
          contentEl.innerHTML = `<iframe id="pdf-frame" src="${entry.file}" title="${entry.label}"></iframe>`;
        } else {
          contentEl.innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="1.3">
                <path d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m.75 12l3 3m0 0l3-3m-3 3v-6m-1.5-9H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
              </svg>
              <p style="font-size:14px;color:var(--text-muted);">${entry.label}</p>
              <button id="pick-pdf-btn" style="padding:9px 20px;border-radius:var(--radius);border:none;background:var(--accent);color:#fff;font-family:var(--font-ui);font-size:13px;cursor:pointer;">
                📂 בחר קובץ PDF
              </button>
              <input type="file" id="pdf-file-input" accept=".pdf" style="display:none" />
              <p style="font-size:11px;color:var(--text-dim);">הקובץ לא עולה לשום מקום — נטען מקומית בלבד</p>
            </div>`;
          document.getElementById('pick-pdf-btn').onclick = () => document.getElementById('pdf-file-input').click();
          document.getElementById('pdf-file-input').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            pdfBlobUrls[key] = url;
            contentEl.innerHTML = `<iframe id="pdf-frame" src="${url}" title="${entry.label}"></iframe>`;
          };
        }
        return;
      }

      // Flashcards mode
      if (viewMode === 'flashcards') {
        contentEl.style.padding = '24px';
        const topicData = course.topics[activeTopic] || {};
        const cards = (topicData.content || []);

        if (cards.length === 0) {
          contentEl.innerHTML = `<div id="empty-state"><p>אין עדיין פלאשקארדס בנושא זה</p></div>`;
          return;
        }

        contentEl.innerHTML = `<div class="flashcards-container">` + cards.map(card => `
          <div class="flashcard" onclick="this.classList.toggle('flipped')">
            <div class="flashcard-inner">
              <div class="flashcard-front">${highlight(card.title)}</div>
              <div class="flashcard-back">
                <div style="padding-top: 10px;">${searchQuery ? highlightBody(card.text) : card.text}</div>
              </div>
            </div>
          </div>
        `).join('') + `</div>`;
        return;
      }

      // Regular Cards Mode
      contentEl.style.padding = '24px';
      const topicData = course.topics[activeTopic] || {};
      const cards = (topicData.content || []);

      if (cards.length === 0) {
        contentEl.innerHTML = `<div id="empty-state"><p>אין עדיין תוכן בנושא זה</p></div>`;
        return;
      }

      contentEl.innerHTML = cards.map(renderCard).join('');
    }

    // ================================================================
    // GLOBAL SEARCH
    // ================================================================
    function handleSearch(q) {
      searchQuery = q.trim();
      render();
    }

    // ================================================================
    // MAIN RENDER
    // ================================================================
    function render() {
      renderSidebar();
      renderMain();
    }

    // ================================================================
    // INIT
    // ================================================================
    document.getElementById('search-input').addEventListener('input', e => handleSearch(e.target.value));
    render();
  </script>
</body>
</html>
