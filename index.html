<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS Summaries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Assistant:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ========== RESET & TOKENS ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #fdfbf0;
      --bg-panel:  #faf6e0;
      --bg-card:   #ffffff;
      --bg-hover:  #f5eecc;
      --border:    rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.15);
      --text:      #1c1917;
      --text-muted:#78716c;
      --text-dim:  #b5a98e;
      --accent:    #1d4ed8;
      --accent-bg: rgba(29,78,216,0.08);
      --green:     #15803d;
      --green-bg:  rgba(21,128,61,0.08);
      --amber:     #b45309;
      --amber-bg:  rgba(180,83,9,0.08);
      --red:       #b91c1c;
      --red-bg:    rgba(185,28,28,0.08);
      --purple:    #6d28d9;
      --purple-bg: rgba(109,40,217,0.08);
      --sidebar-w: 240px;
      --topbar-h:  56px;
      --radius:    8px;
      --radius-lg: 12px;
      --font-ui:   'Assistant', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-serif:'Noto Serif Hebrew', serif;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ========== TOP BAR ========== */
    #topbar {
      height: var(--topbar-h);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .logo span {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 13px;
    }

    .logo small {
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.03em;
    }

    #topbar-search {
      flex: 1;
      max-width: 340px;
      position: relative;
    }

    #search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 36px 7px 14px;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--text-dim); }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 14px;
      pointer-events: none;
    }

    .topbar-stats {
      margin-right: auto;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
    }

    .topbar-stats span { white-space: nowrap; }

    /* ========== LAYOUT ========== */
    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ========== SIDEBAR ========== */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-section-label {
      padding: 14px 14px 6px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    #course-list { overflow-y: auto; flex: 1; padding: 4px 8px 8px; }

    .course-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 2px;
      border: 1px solid transparent;
    }

    .course-item:hover { background: var(--bg-hover); color: var(--text); }

    .course-item.active {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: rgba(88,166,255,0.2);
    }

    .course-icon { font-size: 16px; flex-shrink: 0; }

    .course-count {
      margin-right: auto;
      font-size: 10px;
      background: var(--bg-card);
      padding: 1px 6px;
      border-radius: 10px;
      color: var(--text-dim);
    }

    .course-item.active .course-count {
      background: rgba(88,166,255,0.15);
      color: var(--accent);
    }

    /* ========== MAIN AREA ========== */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    /* ========== COURSE HEADER ========== */
    #course-header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px 0;
      flex-shrink: 0;
    }

    #course-title-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    #course-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    #course-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-right: auto;
    }

    /* ========== TOPIC TABS ========== */
    #topic-tabs {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #topic-tabs::-webkit-scrollbar { display: none; }

    .topic-tab {
      padding: 8px 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-family: var(--font-ui);
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }

    .topic-tab:hover { color: var(--text); }

    .topic-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 500;
    }

    /* ========== CONTENT AREA ========== */
    #content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }

    #content-area::-webkit-scrollbar { width: 6px; }
    #content-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    /* ========== CONTENT CARDS ========== */
    .content-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      margin-bottom: 14px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .card-title { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--text); }
    .card-tags { display: flex; gap: 5px; flex-wrap: wrap; flex-shrink: 0; }

    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .tag-blue   { background: var(--accent-bg);  color: var(--accent); }
    .tag-green  { background: var(--green-bg);   color: var(--green); }
    .tag-amber  { background: var(--amber-bg);   color: var(--amber); }
    .tag-red    { background: var(--red-bg);     color: var(--red); }
    .tag-purple { background: var(--purple-bg);  color: var(--purple); }

    .card-body { font-size: 14px; line-height: 1.7; color: var(--text-muted); }
    .card-body p { margin-bottom: 8px; }
    .card-body p:last-child { margin-bottom: 0; }

    .card-body code {
      font-family: var(--font-mono);
      font-size: 12px;
      background: rgba(0,0,0,0.05);
      padding: 1px 6px;
      border-radius: 4px;
      color: var(--purple);
    }

    .card-body strong { color: var(--text); font-weight: 500; }

    .card-divider { height: 1px; background: var(--border); margin: 12px 0; }

    .complexity-row { display: flex; gap: 6px; flex-wrap: wrap; }

    .complexity-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: var(--bg-hover);
    }

    /* ========== EMPTY STATE ========== */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--text-dim);
    }

    #empty-state svg { opacity: 0.3; }
    #empty-state p { font-size: 14px; }

    /* ========== SEARCH HIGHLIGHT ========== */
    mark { background: rgba(210,153,34,0.25); color: var(--amber); border-radius: 2px; }

    /* ========== PDF VIEWER ========== */
    #pdf-frame { width: 100%; height: 100%; border: none; display: block; background: #525659; }
    .view-toggle { display: flex; gap: 2px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px; margin-right: auto; margin-bottom: 10px; flex-shrink: 0; }
    .view-toggle-btn { padding: 4px 12px; border: none; background: transparent; border-radius: 5px; cursor: pointer; font-size: 12px; font-family: var(--font-ui); color: var(--text-muted); transition: all 0.15s; white-space: nowrap; }
    .view-toggle-btn.active { background: var(--bg-hover); color: var(--text); }

    /* ========== SCROLLBAR ========== */
    #course-list::-webkit-scrollbar { width: 4px; }
    #course-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 640px) {
      :root { --sidebar-w: 200px; }
      #course-title { font-size: 15px; }
      #content-area { padding: 16px; }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div id="topbar">
    <div class="logo">CS Summaries<small>by Yuli Ittah</small></div>
    <div id="topbar-search">
      <span class="search-icon">⌕</span>
      <input type="text" id="search-input" placeholder="חיפוש בכל הסיכומים..." />
    </div>
    <div class="topbar-stats">
      <span id="stat-courses"></span>
      <span id="stat-topics"></span>
    </div>
  </div>

  <!-- MAIN LAYOUT -->
  <div id="layout">

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sidebar-section-label">קורסים</div>
      <div id="course-list"></div>
    </div>

    <!-- CONTENT -->
    <div id="main">
      <div id="course-header">
        <div id="course-title-bar">
          <div id="course-title">בחר קורס</div>
          <div id="course-subtitle"></div>
        </div>
        <div id="topic-tabs"></div>
      </div>
      <div id="content-area">
        <div id="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
          </svg>
          <p>בחר קורס מהתפריט הצדדי</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ================================================================
    // DATA — ערוך כאן את הקורסים והסיכומים שלך
    // כל קורס מכיל: name, icon (emoji), topics
    // כל נושא מכיל מערך של content cards
    // כל card: title, tags, text, complexity (אופציונלי)
    // ================================================================

    const COURSES = {
      linear1: {
        name: "אלגברה לינארית 1",
        icon: "📐",
        pdf: "pdfs/linearit-1.pdf",
        topics: {
          "מרחב וקטורי ובסיס": {
            content: [
              {
                title: "בסיס וקואורדינטות",
                tags: [{ label: "הגדרה", color: "blue" }],
                text: `<p>קבוצה <strong>B = {v₁,...,vₙ}</strong> היא בסיס של מרחב V אם היא פורשת את V ובלתי תלויה לינארית. לכל v∈V קיימים סקלרים <strong>יחידים</strong> a₁,...,aₙ כך ש־v = a₁v₁+...+aₙvₙ.</p>
                <p>וקטור הקואורדינטות: <code>[v]_B = (a₁,...,aₙ)ᵀ</code></p>`,
                complexity: []
              },
              {
                title: "תכונות ייצוג בבסיס",
                tags: [{ label: "חשוב", color: "amber" }],
                text: `<p>לכל u,v∈V וסקלר λ:</p>
                <p><code>[u+v]_B = [u]_B + [v]_B</code></p>
                <p><code>[λv]_B = λ·[v]_B</code></p>
                <p><code>v = 0 ↔ [v]_B = 0</code></p>
                <p><code>v = u ↔ [v]_B = [u]_B</code></p>`,
                complexity: []
              },
              {
                title: "שינוי בסיס — מטריצת המעבר",
                tags: [{ label: "מבחן", color: "green" }],
                text: `<p>אם B וC הם שני בסיסים ל-V, מטריצת המעבר <code>[I]_B^C</code> ממירה קואורדינטות מ-B ל-C:</p>
                <p><code>[v]_C = [I]_B^C · [v]_B</code></p>
                <p>בנייה: עמודה j של <code>[I]_B^C</code> היא <code>[v_j]_C</code> (קואורדינטות של וקטור הבסיס ה-j של B ביחס ל-C).</p>`,
                complexity: []
              },
            ]
          },
          "העתקה לינארית": {
            content: [
              {
                title: "הגדרה ותכונות",
                tags: [{ label: "הגדרה", color: "blue" }],
                text: `<p><strong>T: V→U</strong> היא העתקה לינארית אם לכל u,v∈V וסקלר λ:</p>
                <p><code>T(u+v) = T(u) + T(v)</code></p>
                <p><code>T(λv) = λ·T(v)</code></p>
                <p>נובע: <code>T(0) = 0</code> ו-<code>T(Σaᵢvᵢ) = ΣaᵢT(vᵢ)</code></p>`,
                complexity: []
              },
              {
                title: "שימור תכונות",
                tags: [{ label: "חשוב", color: "amber" }, { label: "מבחן", color: "green" }],
                text: `<p>תהי T: V→U העתקה לינארית ו-{v₁,...,vₖ}⊆V:</p>
                <p><strong>1.</strong> T חד-חד-ערכית ↔ <code>{v₁,...,vₖ}</code> ב"ת לינארית ↔ <code>{T(v₁),...,T(vₖ)}</code> ב"ת לינארית</p>
                <p><strong>2.</strong> T על ↔ <code>{v₁,...,vₖ}</code> פורשת ↔ <code>{T(v₁),...,T(vₖ)}</code> פורשת</p>
                <p><strong>3.</strong> T איזומורפיזם ↔ <code>{v₁,...,vₖ}</code> בסיס ↔ <code>{T(v₁),...,T(vₖ)}</code> בסיס</p>`,
                complexity: []
              },
              {
                title: "איזומורפיזם",
                tags: [{ label: "הגדרה", color: "blue" }],
                text: `<p>T: V→U היא <strong>איזומורפיזם</strong> אם היא לינארית, חד-חד-ערכית ועל (ביקציה לינארית).</p>
                <p>תנאי הכרחי ומספיק: <code>dim V = dim U</code></p>
                <p>אם T איזומורפיזם — <code>T⁻¹</code> קיימת ואיזומורפיזם גם היא.</p>`,
                complexity: []
              },
            ]
          },
          "מטריצה מייצגת": {
            content: [
              {
                title: "הגדרת המטריצה המייצגת",
                tags: [{ label: "הגדרה", color: "blue" }, { label: "מבחן", color: "green" }],
                text: `<p>תהי T: V→U, B={v₁,...,vₙ} בסיס ל-V, C בסיס ל-U.</p>
                <p>המטריצה המייצגת <code>[T]_B^C</code> היא המטריצה שעמודה j שלה = <code>[T(vⱼ)]_C</code>.</p>
                <p>קיים: <code>[T]_B^C · [v]_B = [T(v)]_C</code> לכל v∈V</p>`,
                complexity: []
              },
              {
                title: "אלגברה של מטריצות מייצגות",
                tags: [{ label: "חשוב", color: "amber" }],
                text: `<p><code>[T+S]_B^C = [T]_B^C + [S]_B^C</code></p>
                <p><code>[λT]_B^C = λ·[T]_B^C</code></p>
                <p><code>[S∘T]_B^D = [S]_C^D · [T]_B^C</code> (הרכבה = כפל מטריצות)</p>
                <p><code>([T]_B^C)⁻¹ = [T⁻¹]_C^B</code> (כאשר T הפיכה)</p>
                <p><code>[I]_B^B = I</code> (מטריצת הזהות)</p>`,
                complexity: []
              },
              {
                title: "נוסחת שינוי בסיס למטריצה",
                tags: [{ label: "מבחן", color: "green" }],
                text: `<p>אם B, C בסיסים ל-V ו-A = <code>[T]_B^B</code>, אז:</p>
                <p><code>[T]_C^C = [I]_B^C · [T]_B^B · [I]_C^B = ([I]_B^C) · A · ([I]_B^C)⁻¹</code></p>
                <p>כלומר: שתי מטריצות מייצגות לאותה T בבסיסים שונים הן <strong>דומות</strong> (similar).</p>`,
                complexity: []
              },
            ]
          }
        }
      },

      infi1: {
        name: "חשבון אינפיניטסימלי 1",
        icon: "∞",
        pdf: "pdfs/infi-1.pdf",
        topics: {
          "סדרות": {
            content: [
              {
                title: "הגדרת הגבול — ε-N",
                tags: [{ label: "הגדרה", color: "blue" }],
                text: `<p>סדרה <code>(aₙ)</code> מתכנסת ל-L אם: לכל <strong>ε>0</strong> קיים <strong>N</strong> כך שלכל n>N מתקיים <code>|aₙ - L| &lt; ε</code>.</p>
                <p>כתיב: <code>lim aₙ = L</code> או <code>aₙ → L</code></p>`,
                complexity: []
              },
              {
                title: "כלל הסנדוויץ' ותכונות בסיסיות",
                tags: [{ label: "חשוב", color: "amber" }],
                text: `<p><strong>כלל הסנדוויץ':</strong> אם <code>aₙ ≤ bₙ ≤ cₙ</code> ו-<code>aₙ, cₙ → L</code> אז <code>bₙ → L</code>.</p>
                <p><strong>תכונות אלגבריות:</strong> אם aₙ→L ו-bₙ→M אז: <code>aₙ+bₙ → L+M</code>, <code>aₙ·bₙ → L·M</code>, <code>aₙ/bₙ → L/M</code> (M≠0).</p>
                <p>אם <code>aₙ → ∞</code> אז <code>1/aₙ → 0</code>. אם <code>aₙ → L≠0</code> אז <code>|aₙ| → |L|</code>.</p>`,
                complexity: []
              },
              {
                title: "המספר e וגבולות חשובים",
                tags: [{ label: "מבחן", color: "green" }],
                text: `<p><code>e = lim(1 + 1/n)ⁿ</code> כאשר n→∞</p>
                <p>הכללה: <code>lim(1 + a/n)ⁿ = eᵃ</code></p>
                <p>שקילות: אם <code>aₙ → ∞</code> אז <code>(1 + 1/aₙ)^aₙ → e</code></p>
                <p><code>lim b·(aₙ-1) = c</code> כאשר <code>aₙ → 1</code> ← ניתן להשתמש בהצבה</p>`,
                complexity: []
              },
              {
                title: "קריטריון קושי לסדרות",
                tags: [{ label: "חשוב", color: "amber" }],
                text: `<p>סדרה <code>(aₙ)</code> מתכנסת <strong>אם ורק אם</strong> היא סדרת קושי:</p>
                <p>לכל ε>0 קיים N כך שלכל m,n>N: <code>|aₙ - aₘ| &lt; ε</code></p>
                <p>שימושי להוכחת קיום גבול ללא ידיעת ערכו.</p>`,
                complexity: []
              },
            ]
          },
          "טורים": {
            content: [
              {
                title: "הגדרה והתכנסות",
                tags: [{ label: "הגדרה", color: "blue" }],
                text: `<p>הסכומים החלקיים: <code>Sₙ = Σₖ₌₁ⁿ aₖ</code></p>
                <p>טור <code>Σaₙ</code> <strong>מתכנס</strong> אם סדרת הסכומים החלקיים (Sₙ) מתכנסת.</p>
                <p><strong>תנאי הכרחי (לא מספיק!):</strong> אם Σaₙ מתכנס → <code>aₙ → 0</code>. ההיפך לא נכון (דוגמה: Σ1/n מתבדר).</p>`,
                complexity: []
              },
              {
                title: "טור הנדסי ותכונות אלגבריות",
                tags: [{ label: "חשוב", color: "amber" }],
                text: `<p><strong>טור הנדסי:</strong> <code>Σqⁿ</code> מתכנס אם ורק אם |q|&lt;1, ואז <code>Σₙ₌₀^∞ qⁿ = 1/(1-q)</code>.</p>
                <p><strong>אלגברה:</strong> אם Σaₙ וΣbₙ מתכנסים אז <code>Σ(aₙ+bₙ)</code> מתכנס, וכן <code>Σ(c·aₙ) = c·Σaₙ</code>.</p>`,
                complexity: []
              },
              {
                title: "מבחני התכנסות — השוואה ושורש",
                tags: [{ label: "מבחן", color: "green" }],
                text: `<p><strong>מבחן השוואה:</strong> אם <code>0 ≤ aₙ ≤ bₙ</code>: Σbₙ מתכנס ← Σaₙ מתכנס; Σaₙ מתבדר ← Σbₙ מתבדר.</p>
                <p><strong>מבחן שורש (קושי):</strong> <code>lim ⁿ√|aₙ| = q</code>: אם q&lt;1 — מתכנס בהחלט; q>1 — מתבדר; q=1 — אי-מסקנה.</p>
                <p><strong>מבחן מנה (ד'אלמבר):</strong> <code>lim |aₙ₊₁/aₙ| = q</code>: אותן מסקנות כמו מבחן השורש.</p>`,
                complexity: []
              },
              {
                title: "מבחן לייבניץ והתכנסות מוחלטת",
                tags: [{ label: "מבחן", color: "green" }, { label: "חשוב", color: "amber" }],
                text: `<p><strong>מבחן לייבניץ (טורים מתחלפים):</strong> <code>Σ(-1)ⁿaₙ</code> מתכנס אם <code>aₙ</code> מונוטון יורד ו-<code>aₙ → 0</code>.</p>
                <p><strong>התכנסות מוחלטת:</strong> Σ|aₙ| מתכנס → Σaₙ מתכנס (ההיפך לא בהכרח).</p>
                <p><strong>התכנסות מותנית:</strong> Σaₙ מתכנס אך Σ|aₙ| מתבדר (דוגמה: Σ(-1)ⁿ/n).</p>`,
                complexity: []
              },
            ]
          },
          "פונקציות ורציפות": {
            content: [
              {
                title: "גבול פונקציה — ε-δ",
                tags: [{ label: "הגדרה", color: "blue" }],
                text: `<p><code>lim_{x→a} f(x) = L</code> אם: לכל ε>0 קיים δ>0 כך שלכל x עם <code>0 &lt; |x-a| &lt; δ</code> מתקיים <code>|f(x)-L| &lt; ε</code>.</p>
                <p><strong>גבולות חד-צדדיים:</strong> <code>lim_{x→a} f(x) = L ↔ lim_{x→a⁻} f(x) = lim_{x→a⁺} f(x) = L</code></p>`,
                complexity: []
              },
              {
                title: "גבולות חשובים",
                tags: [{ label: "מבחן", color: "green" }],
                text: `<p><code>lim_{x→0} sin(x)/x = 1</code></p>
                <p><code>lim_{x→0} (1-cos(x))/x² = 1/2</code></p>
                <p><code>lim_{x→0} (aˣ-1)/x = ln a</code> (בפרט: <code>(eˣ-1)/x → 1</code>)</p>
                <p><code>lim_{x→0} ln(1+x)/x = 1</code></p>
                <p><code>lim_{x→0} (1+x)^{1/x} = e</code></p>`,
                complexity: []
              },
              {
                title: "רציפות",
                tags: [{ label: "הגדרה", color: "blue" }, { label: "חשוב", color: "amber" }],
                text: `<p>f <strong>רציפה</strong> בנקודה a אם <code>lim_{x→a} f(x) = f(a)</code> (הגבול קיים, f מוגדרת, ושווים).</p>
                <p><strong>משפט ערך הביניים (IVT):</strong> f רציפה על [a,b], f(a)&lt;0&lt;f(b) → קיים c∈(a,b): f(c)=0.</p>
                <p><strong>משפט קנטור (EVT):</strong> f רציפה על [a,b] — חסומה ומגיעה למקסימום ומינימום.</p>`,
                complexity: []
              },
              {
                title: "נקודות אי-רציפות",
                tags: [{ label: "הגדרה", color: "blue" }],
                text: `<p><strong>סילוק:</strong> הגבול קיים אך שונה מ-f(a) או f לא מוגדרת (ניתן "לתקן").</p>
                <p><strong>קפיצה:</strong> הגבולות החד-צדדיים קיימים אך שונים זה מזה.</p>
                <p><strong>מהותית:</strong> לפחות אחד מהגבולות החד-צדדיים לא קיים (סופי).</p>`,
                complexity: []
              },
            ]
          },
          "נגזרות": {
            content: [
              {
                title: "הגדרת הנגזרת",
                tags: [{ label: "הגדרה", color: "blue" }],
                text: `<p><code>f'(a) = lim_{h→0} [f(a+h) - f(a)] / h</code></p>
                <p>גזירות ← רציפות (לא ההיפך! דוגמה: |x| רציף ב-0 אך לא גזיר).</p>
                <p>פרשנות: שיפוע המשיק לגרף f בנקודה (a, f(a)).</p>`,
                complexity: []
              },
              {
                title: "כללי נגזרות",
                tags: [{ label: "מבחן", color: "green" }],
                text: `<p><code>(f+g)' = f'+g'</code>, <code>(cf)' = cf'</code></p>
                <p><code>(fg)' = f'g + fg'</code> (כלל המכפלה)</p>
                <p><code>(f/g)' = (f'g - fg') / g²</code> (כלל המנה)</p>
                <p><code>(f(g(x)))' = f'(g(x))·g'(x)</code> (כלל השרשרת)</p>
                <p><strong>נגזרת הפונקציה ההפוכה:</strong> <code>(f⁻¹)'(y) = 1 / f'(f⁻¹(y))</code></p>`,
                complexity: []
              },
              {
                title: "נגזרות בסיסיות",
                tags: [{ label: "חשוב", color: "amber" }],
                text: `<p><code>(xⁿ)' = nxⁿ⁻¹</code> · <code>(eˣ)' = eˣ</code> · <code>(ln x)' = 1/x</code></p>
                <p><code>(sin x)' = cos x</code> · <code>(cos x)' = -sin x</code> · <code>(tan x)' = 1/cos²x</code></p>
                <p><code>(arcsin x)' = 1/√(1-x²)</code> · <code>(arccos x)' = -1/√(1-x²)</code> · <code>(arctan x)' = 1/(1+x²)</code></p>
                <p><code>(aˣ)' = aˣ·ln a</code></p>`,
                complexity: []
              },
              {
                title: "משפט לגראנז' ולופיטל",
                tags: [{ label: "מבחן", color: "green" }, { label: "חשוב", color: "amber" }],
                text: `<p><strong>משפט ערך הממוצע (MVT/לגראנז'):</strong> f רציפה על [a,b], גזירה על (a,b) → קיים c: <code>f'(c) = [f(b)-f(a)]/(b-a)</code>.</p>
                <p><strong>כלל לופיטל:</strong> אם <code>lim f(x) = lim g(x) = 0</code> (או ±∞) ו-g'(x)≠0 בסביבה → <code>lim f/g = lim f'/g'</code>.</p>
                <p><strong>סדר גודל:</strong> <code>ln x ≪ xᵃ ≪ eˣ</code> לכל a>0 (כאשר x→∞).</p>`,
                complexity: []
              },
            ]
          }
        }
      },

    };

    // ================================================================
    // STATE
    // ================================================================
    let activeCourse = null;
    let activeTopic = null;
    let searchQuery = '';
    let viewMode = 'cards'; // 'cards' | 'pdf'
    const pdfBlobUrls = {}; // courseId → blob URL (persists across tab switches)

    // ================================================================
    // TAG COLOR MAP
    // ================================================================
    const tagColorMap = {
      "בסיסי": "blue", "חשוב": "amber", "מבחן": "green",
      "מתקדם": "purple", "יעיל": "blue", "LIFO": "blue",
      "FIFO": "blue", "D&C": "purple", "לינארי": "red",
      "קלאסי": "blue", "מאוזן": "purple", "מהיר": "blue",
      "אמין": "green",
    };

    // ================================================================
    // RENDER HELPERS
    // ================================================================
    function renderTag(tag) {
      const color = tag.color || tagColorMap[tag.label] || 'blue';
      return `<span class="tag tag-${color}">${tag.label}</span>`;
    }

    function renderCard(card) {
      const tags = (card.tags || []).map(renderTag).join('');
      const pills = (card.complexity || [])
        .map(c => `<span class="complexity-pill">${c}</span>`).join('');
      const body = card.text || '';
      return `
        <div class="content-card">
          <div class="card-header">
            <div class="card-title">${highlight(card.title)}</div>
            <div class="card-tags">${tags}</div>
          </div>
          <div class="card-body">${searchQuery ? highlightBody(body) : body}</div>
          ${pills ? `<div class="card-divider"></div><div class="complexity-row">${pills}</div>` : ''}
        </div>`;
    }

    function highlight(text) {
      if (!searchQuery) return text;
      const re = new RegExp(`(${escapeRe(searchQuery)})`, 'gi');
      return text.replace(re, '<mark>$1</mark>');
    }

    function highlightBody(html) {
      if (!searchQuery) return html;
      // Only highlight text nodes, not tags
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      highlightNode(tmp);
      return tmp.innerHTML;
    }

    function highlightNode(node) {
      if (node.nodeType === 3) {
        const re = new RegExp(`(${escapeRe(searchQuery)})`, 'gi');
        if (re.test(node.textContent)) {
          const span = document.createElement('span');
          span.innerHTML = node.textContent.replace(re, '<mark>$1</mark>');
          node.parentNode.replaceChild(span, node);
        }
      } else {
        Array.from(node.childNodes).forEach(highlightNode);
      }
    }

    function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    // ================================================================
    // RENDER SIDEBAR
    // ================================================================
    function renderSidebar() {
      const list = document.getElementById('course-list');
      list.innerHTML = '';
      let courseCount = 0;
      let topicCount = 0;

      Object.entries(COURSES).forEach(([id, course]) => {
        if (searchQuery) {
          // check if query matches course name or any topic/content
          const match = courseMatches(id, course);
          if (!match) return;
        }

        courseCount++;
        topicCount += Object.keys(course.topics).length;

        const item = document.createElement('div');
        item.className = 'course-item' + (activeCourse === id ? ' active' : '');
        const topicNum = Object.keys(course.topics).length;
        item.innerHTML = `<span class="course-icon">${course.icon}</span>${course.name}<span class="course-count">${topicNum}</span>`;
        item.onclick = () => selectCourse(id);
        list.appendChild(item);
      });

      document.getElementById('stat-courses').textContent = `${courseCount} קורסים`;
      document.getElementById('stat-topics').textContent = `${topicCount} נושאים`;
    }

    function courseMatches(id, course) {
      if (course.name.includes(searchQuery)) return true;
      for (const [topic, data] of Object.entries(course.topics)) {
        if (topic.includes(searchQuery)) return true;
        for (const card of (data.content || [])) {
          if (card.title.includes(searchQuery)) return true;
          if ((card.text || '').includes(searchQuery)) return true;
        }
      }
      return false;
    }

    // ================================================================
    // SELECT COURSE
    // ================================================================
    function selectCourse(id) {
      activeCourse = id;
      activeTopic = Object.keys(COURSES[id].topics)[0];
      viewMode = COURSES[id].pdf ? 'pdf' : 'cards';
      render();
    }

    // ================================================================
    // RENDER MAIN
    // ================================================================
    function renderMain() {
      const titleEl = document.getElementById('course-title');
      const subtitleEl = document.getElementById('course-subtitle');
      const tabsEl = document.getElementById('topic-tabs');
      const contentEl = document.getElementById('content-area');

      if (!activeCourse) {
        titleEl.textContent = 'בחר קורס';
        subtitleEl.textContent = '';
        tabsEl.innerHTML = '';
        contentEl.innerHTML = `<div id="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/>
          </svg>
          <p>בחר קורס מהתפריט הצדדי</p>
        </div>`;
        return;
      }

      const course = COURSES[activeCourse];
      titleEl.textContent = `${course.icon} ${course.name}`;
      subtitleEl.textContent = `${Object.keys(course.topics).length} נושאים`;

      // Build header: toggle (if pdf exists) + tabs (only in cards mode)
      tabsEl.innerHTML = '';

      if (course.pdf) {
        const toggle = document.createElement('div');
        toggle.className = 'view-toggle';
        toggle.innerHTML = `
          <button class="view-toggle-btn ${viewMode === 'pdf' ? 'active' : ''}" id="btn-pdf">📄 PDF</button>
          <button class="view-toggle-btn ${viewMode === 'cards' ? 'active' : ''}" id="btn-cards">🗂 כרטיסיות</button>
        `;
        toggle.querySelector('#btn-pdf').onclick = () => { viewMode = 'pdf'; renderContent(); toggle.querySelector('#btn-pdf').className = 'view-toggle-btn active'; toggle.querySelector('#btn-cards').className = 'view-toggle-btn'; hideTabs(); };
        toggle.querySelector('#btn-cards').onclick = () => { viewMode = 'cards'; renderMain(); };
        tabsEl.appendChild(toggle);
      }

      if (viewMode === 'cards') {
        Object.keys(course.topics).forEach(topic => {
          const tab = document.createElement('button');
          tab.className = 'topic-tab' + (activeTopic === topic ? ' active' : '');
          tab.textContent = topic;
          tab.onclick = () => { activeTopic = topic; renderContent(); updateTabs(); };
          tabsEl.appendChild(tab);
        });
      }

      renderContent();
    }

    function hideTabs() {
      document.querySelectorAll('.topic-tab').forEach(t => t.remove());
    }

    function updateTabs() {
      document.querySelectorAll('.topic-tab').forEach((tab, i) => {
        const topics = Object.keys(COURSES[activeCourse].topics);
        tab.className = 'topic-tab' + (topics[i] === activeTopic ? ' active' : '');
      });
    }

    function renderContent() {
      const contentEl = document.getElementById('content-area');
      const course = COURSES[activeCourse];

      // PDF mode
      if (viewMode === 'pdf' && course.pdf) {
        contentEl.style.padding = '0';

        if (pdfBlobUrls[activeCourse]) {
          // Already loaded via file picker — show directly
          contentEl.innerHTML = `<iframe id="pdf-frame" src="${pdfBlobUrls[activeCourse]}" title="סיכום PDF"></iframe>`;
        } else if (location.protocol !== 'file:') {
          // Online (GitHub Pages / any server) — load directly by path
          contentEl.innerHTML = `<iframe id="pdf-frame" src="${course.pdf}" title="סיכום PDF"></iframe>`;
        } else {
          // Need to pick the file
          contentEl.innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="1.3">
                <path d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m.75 12l3 3m0 0l3-3m-3 3v-6m-1.5-9H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
              </svg>
              <p style="font-size:14px;color:var(--text-muted);">בחר את קובץ ה-PDF של הקורס</p>
              <button id="pick-pdf-btn" style="padding:9px 20px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--accent);color:#fff;font-family:var(--font-ui);font-size:13px;cursor:pointer;">
                📂 בחר קובץ PDF
              </button>
              <input type="file" id="pdf-file-input" accept=".pdf" style="display:none" />
              <p style="font-size:11px;color:var(--text-dim);">הקובץ לא עולה לשום מקום — נטען מקומית בלבד</p>
            </div>`;

          document.getElementById('pick-pdf-btn').onclick = () => document.getElementById('pdf-file-input').click();
          document.getElementById('pdf-file-input').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            pdfBlobUrls[activeCourse] = url;
            contentEl.innerHTML = `<iframe id="pdf-frame" src="${url}" title="סיכום PDF"></iframe>`;
          };
        }
        return;
      }

      contentEl.style.padding = '24px';
      const topicData = course.topics[activeTopic] || {};
      const cards = (topicData.content || []);

      if (cards.length === 0) {
        contentEl.innerHTML = `<div id="empty-state"><p>אין עדיין תוכן בנושא זה</p></div>`;
        return;
      }

      contentEl.innerHTML = cards.map(renderCard).join('');
    }

    // ================================================================
    // GLOBAL SEARCH
    // ================================================================
    function handleSearch(q) {
      searchQuery = q.trim();
      if (!activeCourse && searchQuery) {
        // auto-show first matching
      }
      render();
    }

    // ================================================================
    // MAIN RENDER
    // ================================================================
    function render() {
      renderSidebar();
      renderMain();
    }

    // ================================================================
    // INIT
    // ================================================================
    document.getElementById('search-input').addEventListener('input', e => handleSearch(e.target.value));
    render();
  </script>
</body>
</html>
