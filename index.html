<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS Summaries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Assistant:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ========== RESET & TOKENS ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fdfbf0; --bg-panel: #faf6e0; --bg-card: #ffffff; --bg-hover: #f5eecc;
      --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.15);
      --text: #1c1917; --text-muted: #78716c; --text-dim: #b5a98e;
      --accent: #1d4ed8; --accent-bg: rgba(29,78,216,0.08);
      --sidebar-w: 240px; --topbar-h: 64px; --radius: 8px; --radius-lg: 12px;
      --font-ui: 'Assistant', sans-serif; --font-mono: 'JetBrains Mono', monospace; --font-serif: 'Noto Serif Hebrew', serif;
    }
    body { font-family: var(--font-ui); background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #topbar { height: var(--topbar-h); background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0; z-index: 10; }
    .logo { font-family: var(--font-serif); font-size: 15px; font-weight: 600; white-space: nowrap; display: flex; flex-direction: column; }
    .logo small { font-size: 10px; color: var(--text-dim); }
    #search-input { width: 100%; max-width: 340px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 14px; font-size: 13px; outline: none; }
    .emoji-row { display: flex; gap: 15px; font-size: 20px; margin-right: auto; padding-left: 10px; }
    #layout { display: flex; flex: 1; overflow: hidden; }
    #sidebar { width: var(--sidebar-w); background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
    #course-list { overflow-y: auto; flex: 1; padding: 4px 8px; }
    .course-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius); cursor: pointer; color: var(--text-muted); font-size: 13px; margin-bottom: 2px; }
    .course-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    #course-header { background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 14px 24px 0; flex-shrink: 0; }
    #course-title { font-family: var(--font-serif); font-size: 18px; font-weight: 600; margin-bottom: 12px; }
    #content-area { flex: 1; overflow-y: auto; padding: 24px; }
    .content-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 22px; margin-bottom: 14px; }
    .card-title { font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
    .card-body { font-size: 15px; line-height: 1.85; color: var(--text-muted); }
    .card-body p.formula { font-family: var(--font-mono); font-size: 15px; text-align: center; padding: 12px; background: #fff0e4; border-right: 4px solid #e8894a; border-radius: 6px 0 0 6px; color: #c2601a; margin: 12px 0; direction: ltr; }
    .flashcards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .flashcard { height: 240px; perspective: 1000px; cursor: pointer; }
    .flashcard-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
    .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .flashcard-front { background: var(--bg-card); border: 1px solid var(--border); color: var(--accent); font-family: var(--font-serif); font-size: 18px; font-weight: 600; text-align: center; }
    .flashcard-back { background: var(--bg-panel); border: 2px solid var(--accent); transform: rotateY(180deg); font-size: 14px; text-align: right; overflow-y: auto; justify-content: flex-start; align-items: flex-start; }
    .view-toggle { display: flex; gap: 2px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px; margin-right: auto; margin-bottom: 10px; width: fit-content; }
    .view-toggle-btn { padding: 4px 12px; border: none; background: transparent; border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--text-muted); }
    .view-toggle-btn.active { background: var(--bg-hover); color: var(--text); font-weight: 600; }
    #pdf-frame { width: 100%; height: 100%; border: none; background: #525659; }
    mark { background: rgba(210,153,34,0.25); color: var(--amber); }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="logo">📚 CS Summaries<small>by Yuli Ittah</small></div>
    <input type="text" id="search-input" placeholder="חיפוש בכל הסיכומים..." />
    <div class="emoji-row"><span>🎓</span><span>📝</span><span>💻</span><span>🧠</span><span>💡</span><span>📖</span></div>
  </div>
  <div id="layout">
    <div id="sidebar"><div id="course-list"></div></div>
    <div id="main">
      <div id="course-header">
        <div id="course-title">בחר קורס</div>
        <div id="topic-tabs"></div>
      </div>
      <div id="content-area"><div id="empty-state"><p>בחר קורס מהתפריט הצדדי</p></div></div>
    </div>
  </div>

  <script>
    const COURSES = {
      ds: {
        name: "מבני נתונים", icon: "🌳", pdfs: [{label: "סיכום", file: "סיכום מבני נתונים.pdf"}],
        content: [
          { title: "חסם עליון (O)", text: "<p>פונקציה f(n) היא ב-O(g(n)) אם קיים קבוע c כך ש f(n) ≤ c*g(n) לכל n גדול מ-n0. מייצג את קצב הגידול המקסימלי (המקרה הגרוע).</p>" },
          { title: "חסם תחתון (Ω)", text: "<p>f(n) היא ב-Ω(g(n)) אם קיים קבוע c כך ש f(n) ≥ c*g(n). מייצג את קצב הגידול המינימלי (האופטימי).</p>" },
          { title: "חסם הדוק (Θ)", text: "<p>מתקיים כאשר f(n) חסומה גם מלמעלה וגם מלמטה על ידי אותה פונקציה g(n) (עם קבועים שונים).</p>" },
          { title: "מחסנית (Stack)", text: "<p>מבנה נתונים מסוג LIFO (Last In First Out). פעולות Push/Pop ב-O(1).</p>" },
          { title: "תור (Queue)", text: "<p>מבנה נתונים מסוג FIFO (First In First Out). פעולות Enqueue/Dequeue ב-O(1).</p>" },
          { title: "מושגי יסוד בעצים", text: "<p><strong>שורש:</strong> הצומת העליון ללא הורה. <strong>עלה:</strong> צומת ללא ילדים. <strong>דרגה:</strong> מספר הילדים. <strong>אבות קדמונים:</strong> מסלול מהשורש לצומת. <strong>צאצאים:</strong> כל הצמתים בתתי-העצים מתחתיו.</p>" },
          { title: "גובה, עומק ורמה", text: "<p><strong>עומק:</strong> מספר הקשתות מהשורש. <strong>גובה:</strong> מספר הקשתות במסלול הארוך ביותר לעלה. <strong>רמה:</strong> קבוצת הצמתים באותו עומק.</p>" },
          { title: "סוגי עצים", text: "<p><strong>מלא:</strong> לכל צומת 0 או 2 ילדים. <strong>שלם:</strong> כל הרמות מלאות פרט לאחרונה שממולאת משמאל. <strong>עץ B:</strong> עץ חיפוש רב-דרכי מאוזן לזיכרון חיצוני.</p>" },
          { title: "סריקות (DFS/BFS)", text: "<p><strong>DFS:</strong> סריקה לעומק (שימוש במחסנית/רקורסיה). <strong>BFS:</strong> סריקה לרוחב (שימוש בתור).</p>" },
          { title: "סיבוכיות מבנים", text: "<p><strong>מערך:</strong> חיפוש O(n), הכנסה O(n). <strong>מערך ממוין:</strong> חיפוש O(log n), הכנסה O(n). <strong>רשימה:</strong> חיפוש O(n). <strong>AVL:</strong> חיפוש/הכנסה/הוצאה O(log n).</p>" }
        ]
      },
      oop: {
        name: "מונחי עצמים", icon: "☕", pdfs: [{label: "סיכום", file: "סיכום מונחי עצמים.pdf"}],
        content: [
          { title: "מחלקה ואובייקט", text: "<p><strong>מחלקה:</strong> התבנית (Blueprint). <strong>אובייקט:</strong> המופע בזיכרון (Instance) שנוצר עם 'new'.</p>" },
          { title: "בנאי (Constructor)", text: "<p>מתודה מיוחדת לאתחול האובייקט. נקראת אוטומטית ביצירת המופע.</p>" },
          { title: "ניהול זיכרון", text: "<p><strong>Heap:</strong> לאובייקטים ומערכים (מנוהל ע\"י ה-GC). <strong>Stack:</strong> לרפרנסים, משתנים פרימיטיביים וקריאות פונקציה.</p>" },
          { title: "מילים שמורות", text: "<p><strong>Final:</strong> קבוע. <strong>Super:</strong> רפרנס למחלקת האב. <strong>Static:</strong> שייך למחלקה עצמה ולא למופע.</p>" },
          { title: "עקרונות OOP", text: "<p><strong>Protected:</strong> הרשאת גישה לחבילה וליורשים. <strong>Interface:</strong> חוזה התנהגות. <strong>Abstract:</strong> מחלקה/מתודה ללא מימוש מלא.</p>" },
          { title: "פולימורפיזם ובינדינג", text: "<p><strong>פולימורפיזם:</strong> שימוש ברפרנס אב לאובייקט בן. <strong>Binding:</strong> קישור קריאה למתודה למימוש (דינמי ב-Java).</p>" },
          { title: "המרה וגנריות", text: "<p><strong>Casting:</strong> שינוי סוג רפרנס (Up/Down). <strong>Generics:</strong> שימוש בפרמטר טיפוס <T> לקוד גמיש ובטוח.</p>" }
        ]
      },
      infi1: {
        name: "חשבון אינפי 1", icon: "∞", pdfs: [{label: "סיכום", file: "infi-summary.pdf"}],
        content: [
          { title: "סדרת קושי", text: "<p>סדרה מתכנסת אם ורק אם לכל ε>0 קיים N כך שלכל n,m>N מתקיים:</p><p class='formula'>|a_n - a_m| < ε</p>" },
          { title: "הגדרת הנגזרת", text: "<p class='formula'>f'(a) = lim_{h→0} [f(a+h) - f(a)] / h</p>" },
          { title: "נגזרת הפוכה", text: "<p class='formula'>(f^{-1})'(y) = 1 / f'(f^{-1}(y))</p>" },
          { title: "משפטי ערך", text: "<p><strong>ערך הביניים:</strong> רציפה מקבלת כל ערך בין קצוותיה. <strong>ויירשטראס 1:</strong> רציפה בסגור חסומה. <strong>ויירשטראס 2:</strong> רציפה בסגור מקבלת מינ/מקס.</p>" },
          { title: "רציפות וגזירות", text: "<p><strong>רציפות:</strong> הגבול שווה לערך בנקודה. <strong>גזירות:</strong> קיים גבול מנת ההפרשים. גזירות גוררת רציפות.</p>" }
        ]
      },
      linear1: {
        name: "לינארית 1", icon: "📐", pdfs: [{label: "סיכום", file: "linear-summary.pdf"}],
        content: [
          { title: "העתקה לינארית", text: "<p class='formula'>T(u+v) = T(u) + T(v)</p><p class='formula'>T(λv) = λT(v)</p>" },
          { title: "משפטי דרגה ומימד", text: "<p><strong>המימדים:</strong> dim(U+W)=dim(U)+dim(W)-dim(U∩W). <strong>הדרגה:</strong> dim(Ker(T))+dim(Im(T))=dim(V).</p>" },
          { title: "בסיס וקואורדינטות", text: "<p><strong>בסיס:</strong> קבוצה פורשת ובת\"ל. <strong>וקטור קואורדינטות:</strong> וקטור הסקלרים בצירוף הלינארי המייצג.</p>" },
          { title: "משפט שלישי חינם", text: "<p>במרחב ממימד n, קבוצה בגודל n שהיא בת\"ל (או פורשת) היא בסיס.</p>" }
        ]
      }
    };

    let activeCourse = null, viewMode = 'cards', searchQuery = '';
    const pdfBlobUrls = {};

    function selectCourse(id) { activeCourse = id; viewMode = 'cards'; render(); }
    function highlight(text) { if (!searchQuery) return text; const re = new RegExp(`(${searchQuery.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&')})`, 'gi'); return text.replace(re, '<mark>$1</mark>'); }

    function renderSidebar() {
      const list = document.getElementById('course-list'); list.innerHTML = '';
      Object.entries(COURSES).forEach(([id, c]) => {
        const item = document.createElement('div');
        item.className = 'course-item' + (activeCourse === id ? ' active' : '');
        item.innerHTML = `<span>${c.icon}</span>${c.name}`;
        item.onclick = () => selectCourse(id);
        list.appendChild(item);
      });
    }

    function renderMain() {
      const titleEl = document.getElementById('course-title'), tabsEl = document.getElementById('topic-tabs');
      if (!activeCourse) return;
      const course = COURSES[activeCourse];
      titleEl.textContent = `${course.icon} ${course.name}`;
      tabsEl.innerHTML = `
        <div class="view-toggle">
          ${course.pdfs ? `<button class="view-toggle-btn ${viewMode === 'pdf' ? 'active' : ''}" onclick="viewMode='pdf';renderMain()">📄 PDF</button>` : ''}
          <button class="view-toggle-btn ${viewMode === 'cards' ? 'active' : ''}" onclick="viewMode='cards';renderMain()">🗂 הגדרות</button>
          <button class="view-toggle-btn ${viewMode === 'flashcards' ? 'active' : ''}" onclick="viewMode='flashcards';renderMain()">🔁 Flashcards</button>
        </div>`;
      renderContent();
    }

    function renderContent() {
      const contentEl = document.getElementById('content-area'), course = COURSES[activeCourse];
      if (viewMode === 'pdf') {
        const entry = course.pdfs[0]; contentEl.style.padding = '0'; const key = `${activeCourse}:0`;
        if (pdfBlobUrls[key]) { contentEl.innerHTML = `<iframe id="pdf-frame" src="${pdfBlobUrls[key]}"></iframe>`; }
        else if (location.protocol !== 'file:') { contentEl.innerHTML = `<iframe id="pdf-frame" src="${entry.file}"></iframe>`; }
        else {
          contentEl.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;">
            <button onclick="document.getElementById('pdf-f').click()" style="padding:10px 20px; border-radius:8px; border:none; background:var(--accent); color:#fff; cursor:pointer;">📂 בחר קובץ PDF מהמחשב</button>
            <input type="file" id="pdf-f" accept=".pdf" style="display:none" onchange="const f=this.files[0]; if(f){const u=URL.createObjectURL(f); pdfBlobUrls['${key}']=u; renderContent();}" />
          </div>`;
        }
        return;
      }
      const cards = course.content.filter(c => c.title.includes(searchQuery) || c.text.includes(searchQuery));
      contentEl.style.padding = '24px';
      if (viewMode === 'flashcards') {
        contentEl.innerHTML = `<div class="flashcards-container">` + cards.map(c => `
          <div class="flashcard" onclick="this.classList.toggle('flipped')">
            <div class="flashcard-inner">
              <div class="flashcard-front">${highlight(c.title)}</div>
              <div class="flashcard-back"><div>${highlight(c.text)}</div></div>
            </div>
          </div>`).join('') + `</div>`;
      } else {
        contentEl.innerHTML = cards.map(c => `<div class="content-card"><div class="card-title">${highlight(c.title)}</div><div class="card-body">${highlight(c.text)}</div></div>`).join('');
      }
    }

    document.getElementById('search-input').oninput = (e) => { searchQuery = e.target.value; renderContent(); };
    function render() { renderSidebar(); renderMain(); }
    render();
  </script>
</body>
</html>
