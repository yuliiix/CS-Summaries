<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS Summaries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Assistant:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ========== RESET & TOKENS ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #fdfbf0;
      --bg-panel:  #faf6e0;
      --bg-card:   #ffffff;
      --bg-hover:  #f5eecc;
      --border:    rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.15);
      --text:      #1c1917;
      --text-muted:#78716c;
      --text-dim:  #b5a98e;
      --accent:    #1d4ed8;
      --accent-bg: rgba(29,78,216,0.08);
      --green:     #15803d;
      --green-bg:  rgba(21,128,61,0.08);
      --amber:     #b45309;
      --amber-bg:  rgba(180,83,9,0.08);
      --red:       #b91c1c;
      --red-bg:    rgba(185,28,28,0.08);
      --purple:    #6d28d9;
      --purple-bg: rgba(109,40,217,0.08);
      --sidebar-w: 240px;
      --topbar-h:  56px;
      --radius:    8px;
      --radius-lg: 12px;
      --font-ui:   'Assistant', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-serif:'Noto Serif Hebrew', serif;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ========== TOP BAR ========== */
    #topbar {
      height: var(--topbar-h);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .logo small {
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.03em;
    }

    #topbar-search {
      flex: 1;
      max-width: 340px;
      position: relative;
    }

    #search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 36px 7px 14px;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--text-dim); }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 14px;
      pointer-events: none;
    }

    .topbar-stats {
      margin-right: auto;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
    }

    /* ========== LAYOUT ========== */
    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #sidebar {
      width: var(--sidebar-w);
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-section-label {
      padding: 14px 14px 6px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    #course-list { overflow-y: auto; flex: 1; padding: 4px 8px 8px; }

    .course-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 2px;
      border: 1px solid transparent;
    }

    .course-item:hover { background: var(--bg-hover); color: var(--text); }
    .course-item.active { background: var(--accent-bg); color: var(--accent); border-color: rgba(88,166,255,0.2); }

    .course-count {
      margin-right: auto;
      font-size: 10px;
      background: var(--bg-card);
      padding: 1px 6px;
      border-radius: 10px;
      color: var(--text-dim);
    }

    /* ========== MAIN AREA ========== */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    #course-header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px 0;
      flex-shrink: 0;
    }

    #course-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }

    #topic-tabs {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .topic-tab {
      padding: 8px 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-family: var(--font-ui);
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .topic-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

    /* ========== CONTENT AREA ========== */
    #content-area { flex: 1; overflow-y: auto; padding: 24px; }

    .content-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      margin-bottom: 14px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .card-title { font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 10px; }
    .card-body { font-size: 15px; line-height: 1.8; color: var(--text-muted); }
    .card-body p.formula {
      font-family: var(--font-mono);
      font-size: 15px;
      text-align: center;
      padding: 10px;
      background: #fff0e4;
      border-right: 3px solid #e8894a;
      border-radius: 6px 0 0 6px;
      color: #c2601a;
      margin: 10px 0;
      direction: ltr;
    }

    /* ========== FLASHCARDS ========== */
    .flashcards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .flashcard { background: transparent; height: 240px; perspective: 1000px; cursor: pointer; }
    .flashcard-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
    .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden;
      border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .flashcard-front { background: var(--bg-card); border: 1px solid var(--border); color: var(--accent); font-family: var(--font-serif); font-size: 18px; font-weight: 600; }
    .flashcard-back { background: var(--bg-panel); border: 2px solid var(--accent); color: var(--text); transform: rotateY(180deg); font-size: 14px; text-align: right; overflow-y: auto; justify-content: flex-start; }

    /* ========== TOGGLE ========== */
    .view-toggle { display: flex; gap: 2px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px; margin-right: auto; margin-bottom: 10px; }
    .view-toggle-btn { padding: 4px 12px; border: none; background: transparent; border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--text-muted); }
    .view-toggle-btn.active { background: var(--bg-hover); color: var(--text); }

    /* ========== PDF VIEWER ========== */
    #pdf-frame { width: 100%; height: 100%; border: none; display: block; background: #525659; }

    #empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); }
    mark { background: rgba(210,153,34,0.25); color: var(--amber); border-radius: 2px; }
  </style>
</head>
<body>

  <div id="topbar">
    <div class="logo">CS Summaries<small>by Yuli Ittah</small></div>
    <div id="topbar-search">
      <input type="text" id="search-input" placeholder="חיפוש בכל הסיכומים..." />
    </div>
    <div class="topbar-stats">
      <span id="stat-courses"></span>
    </div>
  </div>

  <div id="layout">
    <div id="sidebar">
      <div class="sidebar-section-label">קורסים</div>
      <div id="course-list"></div>
    </div>

    <div id="main">
      <div id="course-header">
        <div id="course-title">בחר קורס</div>
        <div id="topic-tabs"></div>
      </div>
      <div id="content-area">
        <div id="empty-state"><p>בחר קורס מהתפריט הצדדי</p></div>
      </div>
    </div>
  </div>

  <script>
    const COURSES = {
      linear1: {
        name: "אלגברה לינארית 1",
        icon: "📐",
        pdfs: [
          { label: "סיכום 1", file: "linear-note1.pdf" },
          { label: "סיכום 2", file: "linear-note2.pdf" }
        ],
        topics: {
          "הגדרות ומשפטים": {
            content: [
              { title: "העתקה לינארית", text: `<p>T(u+v)=T(u)+T(v) וגם T(λv)=λT(v).</p>` },
              { title: "משפט המימדים", text: `<p class="formula">dim(U+W) = dim(U) + dim(W) - dim(U∩W)</p>` },
              { title: "משפט הדרגה", text: `<p>לכל מטריצה, דרגת השורות שווה לדרגת העמודות.</p>` },
              { title: "משפט הדרגה להעתקות", text: `<p class="formula">dim(Ker(T)) + dim(Im(T)) = dim(V)</p>` },
              { title: "תת מרחב", text: `<p>תת קבוצה הסגורה לחיבור וכפל בסקלר ומכילה את וקטור האפס.</p>` },
              { title: "וקטור קואורדינטות", text: `<p class="formula">[v]<sub>B</sub> = (a<sub>1</sub>, ..., a<sub>n</sub>)<sup>T</sup></p>` },
              { title: "מטריצה מייצגת העתקה", text: `<p>מטריצה שעמודותיה הן קואורדינטות תמונות איברי הבסיס.</p>` },
              { title: "משפט ההגדרה", text: `<p>העתקה לינארית נקבעת ביחידות על ידי ערכיה על בסיס.</p>` },
              { title: "מרחב וקטורי", text: `<p>קבוצה המקיימת 8 אקסיומות לגבי חיבור וכפל בסקלר.</p>` },
              { title: "הגדרה של בסיס", text: `<p>קבוצה פורשת ובלתי תלויה לינארית.</p>` },
              { title: "משפט שלישי חינם", text: `<p>במרחב ממימד n, קבוצה בגודל n שהיא בת"ל היא בסיס.</p>` }
            ]
          },
          "מרחב וקטורי ובסיס": {
            content: [
              { title: "בסיס וקואורדינטות", text: `<p>קבוצה B היא בסיס אם היא פורשת ובת"ל.</p>` }
            ]
          }
        }
      },
      
      infi1: {
        name: "חשבון אינפיניטסימלי 1",
        icon: "∞",
        pdfs: [{ label: "סיכום", file: "infi-1.pdf" }],
        topics: {
          "הגדרות ומשפטים": {
            content: [
              { title: "התכנסות סדרה לפי קושי", text: `<p>סדרה מתכנסת אם ורק אם היא סדרת קושי: לכל ε>0 קיים N כך שלכל n,m>N מתקיים |a<sub>n</sub>-a<sub>m</sub>|<ε.</p>` },
              { title: "נגזרת של פונקציה", text: `<p class="formula">f'(a) = lim<sub>h→0</sub> [f(a+h) - f(a)] / h</p>` },
              { title: "נגזרת של פונקציה הפיכה", text: `<p class="formula">(f<sup>-1</sup>)'(y) = 1 / f'(f<sup>-1</sup>(y))</p>` },
              { title: "התכנסות סדרה לאינסוף", text: `<p>לכל M>0 קיים N כך שלכל n>N: a<sub>n</sub>>M.</p>` },
              { title: "משפט ערך הביניים", text: `<p>פונקציה רציפה בקטע סגור מקבלת כל ערך בין קצותיו.</p>` },
              { title: "משפט ויירשטראס 1", text: `<p>פונקציה רציפה בקטע סגור וחסום היא חסומה בו.</p>` },
              { title: "משפט ויירשטראס 2", text: `<p>פונקציה רציפה בקטע סגור וחסום מקבלת בו מקסימום ומינימום.</p>` },
              { title: "התכנסות בהחלט", text: `<p>טור מתכנס בהחלט אם טור הערכים המוחלטים שלו מתכנס.</p>` },
              { title: "רציפות", text: `<p>f רציפה ב-a אם הגבול בנקודה שווה לערכה בנקודה.</p>` },
              { title: "גזירות", text: `<p>f גזירה אם קיים גבול מנת ההפרשים. גזירות גוררת רציפות.</p>` }
            ]
          },
          "סדרות": {
            content: [
              { title: "הגדרת הגבול", text: `<p class="formula">lim a<sub>n</sub> = L</p>` }
            ]
          }
        }
      },

      ds: {
        name: "מבני נתונים",
        icon: "🌳",
        pdfs: [{ label: "סיכום הקורס", file: "ds-summary.pdf" }],
        topics: {
          "סיבוכיות ומשפט האב": {
            content: [
              { title: "סיבוכיות זמן (O, Ω, Θ)", text: `<p><strong>O(f(n))</strong>: חסם עליון (המקרה הגרוע).<br><strong>Ω(f(n))</strong>: חסם תחתון.<br><strong>Θ(f(n))</strong>: חסם הדוק (גם עליון וגם תחתון).</p>` },
              { title: "משפט האב (Master Theorem)", text: `<p>משמש לפתרון נוסחאות נסיגה מהצורה:</p><p class="formula">T(n) = aT(n/b) + f(n)</p><p>משווים את f(n) לעומת n<sup>log<sub>b</sub>a</sup> כדי למצוא מי דומיננטי.</p>` },
              { title: "פתרון עץ רקורסיה", text: `<p>שיטה למציאת סיבוכיות על ידי ציור עץ הרקורסיה, חישוב העלות בכל רמה, וסכימת כל הרמות (למשל סכום סדרה הנדסית).</p>` }
            ]
          },
          "ניתוח לשיעורין (Amortized)": {
            content: [
              { title: "שיטת האגרגציה (Aggregate)", text: `<p>מחשבים חסם עליון T(n) לביצוע של n פעולות ברצף, והעלות המשוערכת לכל פעולה היא פשוט הממוצע:</p><p class="formula">T(n) / n</p>` },
              { title: "שיטת החשבונאות (Accounting)", text: `<p>הקצאת "אסימונים" / "מטבעות" לפעולות. פעולות זולות מקבלות מטבעות עודפים שנשמרים ב"בנק", ופעולות יקרות משתמשות במטבעות שנחסכו כדי לשלם על עצמן (למשל במערך דינמי).</p>` },
              { title: "שיטת הפוטנציאל (Potential)", text: `<p>מגדירים פונקציית פוטנציאל Φ(D) שמייצגת את ה"אנרגיה האגורה" במבנה הנתונים. העלות המשוערכת מוגדרת כך:</p><p class="formula">ĉ<sub>i</sub> = c<sub>i</sub> + Φ(D<sub>i</sub>) - Φ(D<sub>i-1</sub>)</p>` }
            ]
          },
          "עצים בסיסיים ו-AVL": {
            content: [
              { title: "סריקות עץ (Traversals)", text: `<p><strong>Pre-order</strong>: קודם שורש, אח"כ ילדים.<br><strong>In-order</strong>: שמאלי, שורש, ימני (בעץ חיפוש נותן מיון).<br><strong>Post-order</strong>: ילדים, ובסוף השורש.</p>` },
              { title: "עץ חיפוש בינארי (BST)", text: `<p>לכל צומת: כל הערכים בתת-העץ השמאלי קטנים ממנו, וכל הערכים בתת-העץ הימני גדולים ממנו.</p>` },
              { title: "עץ AVL - איזון (BF)", text: `<p>עץ חיפוש בינארי מאוזן גבהים. לכל צומת מחשבים גורם איזון (Balance Factor):</p><p class="formula">BF = h(Left) - h(Right)</p><p>העץ חוקי רק אם ה-BF הוא 1, 0 או -1.</p>` }
            ]
          },
          "מבני נתונים אלמנטריים": {
            content: [
              { title: "מחסנית (Stack)", text: `<p>פועלת בשיטת <strong>LIFO</strong> (Last In First Out).<br>פעולות עיקריות: <code>Push</code> (הכנסה) ו-<code>Pop</code> (הוצאה). O(1).</p>` },
              { title: "תור (Queue)", text: `<p>פועל בשיטת <strong>FIFO</strong> (First In First Out).<br>פעולות עיקריות: <code>Enqueue</code> (הכנסה לסוף) ו-<code>Dequeue</code> (הוצאה מההתחלה).</p>` }
            ]
          }
        }
      },

      oop: {
        name: "תכנות מונחה עצמים",
        icon: "☕",
        pdfs: [{ label: "סיכום הקורס", file: "oop-summary.pdf" }],
        topics: {
          "עקרונות ומבנה": {
            content: [
              { title: "כימוס (Encapsulation)", text: `<p>הסתרת המידע הפנימי של המחלקה. מתבצע לרוב על ידי הגדרת שדות כ-<code>private</code> וחשיפתם דרך מתודות <code>Getters</code> ו-<code>Setters</code>.</p>` },
              { title: "הורשה (Inheritance)", text: `<p>מחלקה אחת יורשת מאחרת באמצעות המילה <code>extends</code>. מחלקת הבן יורשת את כל השדות והמתודות (בהתאם להרשאות), ויכולה לדרוס מתודות (<code>@Override</code>).</p>` },
              { title: "מילה שמורה this ו-super", text: `<p><code>this</code> מצביע לאובייקט הנוכחי (משמש למניעת התנגשות שמות).<br><code>super</code> משמש לקריאה לבנאי של מחלקת האב או למתודות שלה.</p>` },
              { title: "הרשאות גישה (Access Modifiers)", text: `<p><strong>Private</strong>: גישה רק מהמחלקה.<br><strong>Default</strong>: גישה מכל החבילה (Package).<br><strong>Protected</strong>: גישה מהחבילה וממחלקות יורשות.<br><strong>Public</strong>: גישה חופשית מכולם.</p>` }
            ]
          },
          "זיכרון ב-Java": {
            content: [
              { title: "Heap vs Stack", text: `<p><strong>Stack (מחסנית)</strong>: שומר משתנים פרימיטיביים (כמו int) ורפרנסים לאובייקטים. מתנקה אוטומטית כשהפונקציה מסתיימת.<br><strong>Heap (ערימה)</strong>: שומר את האובייקטים עצמם (אלו שנוצרו עם <code>new</code>).</p>` },
              { title: "משתנה ומתודה סטטיים (static)", text: `<p>שייכים <strong>למחלקה עצמה</strong> ולא לאובייקט (מופע) ספציפי. הקומפיילר ניגש אליהם דרך שם המחלקה, גם אם הרפרנס הוא null.</p>` },
              { title: "String Pool", text: `<p>מחרוזות הן Immutable (לא ניתנות לשינוי). אם ניצור <code>String s = "Hello"</code>, Java תשמור אותו ב-Pool. אם ניצור עוד מחרוזת זהה, היא תצביע לאותו מקום בזיכרון.</p>` }
            ]
          },
          "פולימורפיזם וממשקים": {
            content: [
              { title: "Upcasting ו-Downcasting", text: `<p><strong>Upcasting</strong>: השמת אובייקט מסוג בן לרפרנס מסוג אב (בטוח ותמיד עובד).<br><strong>Downcasting</strong>: המרה הפוכה, דורשת Casting מפורש ויכולה לזרוק <code>ClassCastException</code>. רצוי לבדוק קודם עם <code>instanceof</code>.</p>` },
              { title: "מחלקה מופשטת (Abstract Class)", text: `<p>מחלקה שלא ניתן ליצור ממנה מופעים (<code>new</code>). נועדה להיות מחלקת אב. יכולה להכיל שדות רגילים, מתודות רגילות ומתודות אבסטרקטית שהבנים חייבים לממש.</p>` },
              { title: "ממשק (Interface)", text: `<p>חוזה שמגדיר התנהגות. מחלקה מממשת ממשק בעזרת <code>implements</code>. בממשק כל השדות הם <code>public static final</code> ואין בו שמירת מצב (State).</p>` }
            ]
          },
          "Generics & Collections": {
            content: [
              { title: "ג'נריקס (Generics <T>)", text: `<p>מאפשר כתיבת קוד גמיש שמתאים למספר סוגי טיפוסים (כמו <code>ArrayList&lt;String&gt;</code>). מונע שגיאות של Casting בזמן ריצה.</p>` },
              { title: "Iterable ו-Iterator", text: `<p>מחלקה שמממשת <code>Iterable</code> (שיש לה מתודת <code>iterator()</code>) מאפשרת לעבור על איבריה בלולאת <code>for-each</code>.<br>ה-<code>Iterator</code> עצמו ממש את הפונקציות <code>hasNext()</code> ו-<code>next()</code>.</p>` },
              { title: "Collections", text: `<p><strong>ArrayList</strong>: מערך דינמי (טוב לגישה באינדקס).<br><strong>LinkedList</strong>: רשימה מקושרת (טוב להכנסות/הוצאות בקצוות).<br><strong>HashSet</strong>: סט ללא כפילויות, לא שומר על סדר.<br><strong>HashMap</strong>: מילון של מפתח-ערך (Key-Value).</p>` }
            ]
          }
        }
      }

    };

    let activeCourse = null, activeTopic = null, viewMode = 'cards', searchQuery = '';
    let activePdfIndex = 0;
    const pdfBlobUrls = {};

    function selectCourse(id) {
      activeCourse = id;
      activeTopic = Object.keys(COURSES[id].topics)[0];
      activePdfIndex = 0;
      
      const c = COURSES[id];
      // אם למשתמש יש PDF והוא לחץ על הקורס, אפשר להחליט שזה יפתח את לשונית ה-PDF כברירת מחדל
      // אבל מכיוון שאתה רוצה לראות את הכרטיסיות, נשאיר כברירת מחדל 'cards'
      viewMode = 'cards'; 
      render();
    }

    function renderSidebar() {
      const list = document.getElementById('course-list');
      list.innerHTML = '';
      Object.entries(COURSES).forEach(([id, c]) => {
        const item = document.createElement('div');
        item.className = 'course-item' + (activeCourse === id ? ' active' : '');
        item.innerHTML = `<span class="course-icon">${c.icon}</span>${c.name}<span class="course-count">${Object.keys(c.topics).length}</span>`;
        item.onclick = () => selectCourse(id);
        list.appendChild(item);
      });
      document.getElementById('stat-courses').textContent = `${Object.keys(COURSES).length} קורסים`;
    }

    function renderMain() {
      const titleEl = document.getElementById('course-title');
      const tabsEl = document.getElementById('topic-tabs');
      
      if (!activeCourse) return;
      
      const course = COURSES[activeCourse];
      titleEl.textContent = `${course.icon} ${course.name}`;
      
      tabsEl.innerHTML = '';
      const hasPdfs = course.pdfs && course.pdfs.length > 0;

      // כפתורי השליטה הראשיים (תצוגות)
      const toggle = document.createElement('div');
      toggle.className = 'view-toggle';
      toggle.innerHTML = `
        ${hasPdfs ? `<button class="view-toggle-btn ${viewMode === 'pdf' ? 'active' : ''}" onclick="viewMode='pdf';renderMain()">📄 PDF</button>` : ''}
        <button class="view-toggle-btn ${viewMode === 'cards' ? 'active' : ''}" onclick="viewMode='cards';renderMain()">🗂 סיכומים</button>
        <button class="view-toggle-btn ${viewMode === 'flashcards' ? 'active' : ''}" onclick="viewMode='flashcards';renderMain()">🔁 Flashcards</button>
      `;
      tabsEl.appendChild(toggle);

      // כפתורי הניווט הפנימיים (הנושאים השונים של הקורס)
      if (viewMode === 'pdf') {
        course.pdfs.forEach((p, i) => {
          const tab = document.createElement('button');
          tab.className = 'topic-tab' + (activePdfIndex === i ? ' active' : '');
          tab.textContent = p.label;
          tab.onclick = () => { activePdfIndex = i; renderContent(); renderMain(); };
          tabsEl.appendChild(tab);
        });
      } else {
        Object.keys(course.topics).forEach(t => {
          const tab = document.createElement('button');
          tab.className = 'topic-tab' + (activeTopic === t ? ' active' : '');
          tab.textContent = t;
          tab.onclick = () => { activeTopic = t; renderContent(); renderMain(); };
          tabsEl.appendChild(tab);
        });
      }
      
      renderContent();
    }

    function highlight(text) {
      if (!searchQuery) return text;
      const re = new RegExp(`(${searchQuery.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&')})`, 'gi');
      return text.replace(re, '<mark>$1</mark>');
    }

    function renderContent() {
      const contentEl = document.getElementById('content-area');
      const course = COURSES[activeCourse];

      if (viewMode === 'pdf') {
        const entry = course.pdfs[activePdfIndex];
        contentEl.style.padding = '0';
        
        // טעינת ה-PDF מאותו התיקייה
        contentEl.innerHTML = `<iframe id="pdf-frame" src="${entry.file}" title="${entry.label}"></iframe>`;
        return;
      }

      contentEl.style.padding = '24px';
      const topicData = course.topics[activeTopic] || {};
      const allCards = topicData.content || [];

      // סינון לפי חיפוש
      const cards = allCards.filter(c => 
        c.title.includes(searchQuery) || c.text.includes(searchQuery)
      );

      if (cards.length === 0) {
        contentEl.innerHTML = `<div id="empty-state"><p>לא נמצאו תוצאות לחיפוש או שאין כרטיסיות בנושא.</p></div>`;
        return;
      }

      // רינדור כרטיסיות
      if (viewMode === 'flashcards') {
        contentEl.innerHTML = `<div class="flashcards-container">` + cards.map(c => `
          <div class="flashcard" onclick="this.classList.toggle('flipped')">
            <div class="flashcard-inner">
              <div class="flashcard-front">${highlight(c.title)}</div>
              <div class="flashcard-back"><div>${highlight(c.text)}</div></div>
            </div>
          </div>`).join('') + `</div>`;
      } else {
        contentEl.innerHTML = cards.map(c => `
          <div class="content-card">
            <div class="card-title">${highlight(c.title)}</div>
            <div class="card-body">${highlight(c.text)}</div>
          </div>`).join('');
      }
    }

    function render() { renderSidebar(); renderMain(); }
    
    document.getElementById('search-input').oninput = (e) => { 
      searchQuery = e.target.value; 
      render(); 
    };

    render();
  </script>
</body>
</html>
