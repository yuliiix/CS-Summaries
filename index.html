<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS Summaries</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Assistant:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fdfbf0; --bg-panel: #faf6e0; --bg-card: #ffffff; --bg-hover: #f5eecc;
      --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.15);
      --text: #1c1917; --text-muted: #78716c; --text-dim: #b5a98e;
      --accent: #1d4ed8; --accent-bg: rgba(29,78,216,0.08);
      --green: #15803d; --green-bg: rgba(21,128,61,0.08);
      --amber: #b45309; --amber-bg: rgba(180,83,9,0.08);
      --red: #b91c1c; --red-bg: rgba(185,28,28,0.08);
      --purple: #6d28d9; --purple-bg: rgba(109,40,217,0.08);
      --sidebar-w: 240px; --topbar-h: 60px;
      --radius: 8px; --radius-lg: 12px;
      --font-ui: 'Assistant', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-serif: 'Noto Serif Hebrew', serif;
    }
    html, body { height: 100%; }
    body { font-family: var(--font-ui); background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* TOPBAR */
    #topbar { height: var(--topbar-h); background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0; z-index: 10; }
    .logo { font-family: var(--font-serif); font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; display: flex; flex-direction: column; gap: 1px; }
    .logo small { font-family: var(--font-ui); font-size: 10px; font-weight: 400; color: var(--text-dim); }
    #topbar-search { flex: 1; max-width: 360px; }
    #search-input { width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 14px; color: var(--text); font-family: var(--font-ui); font-size: 13px; outline: none; transition: border-color .15s; }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--text-dim); }
    .topbar-stats { margin-right: auto; font-size: 12px; color: var(--text-muted); display: flex; gap: 16px; }

    /* LAYOUT */
    #layout { display: flex; flex: 1; overflow: hidden; }

    /* SIDEBAR */
    #sidebar { width: var(--sidebar-w); background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
    .sidebar-label { padding: 14px 14px 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); }
    #course-list { overflow-y: auto; flex: 1; padding: 4px 8px 8px; }
    .course-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius); cursor: pointer; color: var(--text-muted); font-size: 13px; font-weight: 500; margin-bottom: 2px; border: 1px solid transparent; transition: background .1s; }
    .course-item:hover { background: var(--bg-hover); color: var(--text); }
    .course-item.active { background: var(--accent-bg); color: var(--accent); border-color: rgba(29,78,216,.15); }
    .course-count { margin-right: auto; font-size: 10px; background: var(--bg-card); padding: 1px 6px; border-radius: 10px; color: var(--text-dim); }
    .course-item.active .course-count { background: rgba(29,78,216,.12); color: var(--accent); }

    /* MAIN */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #course-header { background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 14px 24px 0; flex-shrink: 0; }
    #course-title-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    #course-title { font-family: var(--font-serif); font-size: 18px; font-weight: 600; }
    #course-subtitle { font-size: 12px; color: var(--text-muted); margin-right: auto; }
    #topic-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; align-items: center; flex-wrap: nowrap; padding-bottom: 0; }
    #topic-tabs::-webkit-scrollbar { display: none; }

    /* TOGGLE */
    .view-toggle { display: flex; gap: 2px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px; flex-shrink: 0; }
    .view-toggle-btn { padding: 5px 13px; border: none; background: transparent; border-radius: 5px; cursor: pointer; font-size: 12px; font-family: var(--font-ui); color: var(--text-muted); transition: all .15s; white-space: nowrap; }
    .view-toggle-btn.active { background: var(--bg-hover); color: var(--text); font-weight: 600; }
    .topic-tab { padding: 8px 14px; border: none; background: transparent; cursor: pointer; font-size: 12px; font-family: var(--font-ui); color: var(--text-muted); border-bottom: 2px solid transparent; white-space: nowrap; transition: all .15s; }
    .topic-tab:hover { color: var(--text); }
    .topic-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

    /* CONTENT */
    #content-area { flex: 1; overflow-y: auto; padding: 24px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
    #content-area::-webkit-scrollbar { width: 6px; }
    #content-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    /* CARDS */
    .content-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 22px; margin-bottom: 14px; animation: fadeIn .2s ease; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .card-title { font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: var(--text); }
    .card-tags { display: flex; gap: 5px; flex-wrap: wrap; flex-shrink: 0; }
    .tag { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: .05em; }
    .tag-blue { background: var(--accent-bg); color: var(--accent); }
    .tag-green { background: var(--green-bg); color: var(--green); }
    .tag-amber { background: var(--amber-bg); color: var(--amber); }
    .tag-red { background: var(--red-bg); color: var(--red); }
    .tag-purple { background: var(--purple-bg); color: var(--purple); }
    .card-body { font-size: 15px; line-height: 1.85; color: var(--text-muted); }
    .card-body p { margin-bottom: 10px; }
    .card-body p:last-child { margin-bottom: 0; }
    .card-body code { font-family: var(--font-mono); font-size: 12px; background: rgba(109,40,217,.07); padding: 2px 7px; border-radius: 4px; color: var(--purple); font-weight: 500; }
    .card-body sub, .card-body sup { font-size: .72em; }
    .card-body strong { color: var(--text); font-weight: 600; }
    .card-body p.formula { font-family: var(--font-mono); font-size: 14px; text-align: center; padding: 10px 16px; background: #fff0e4; border-right: 3px solid #e8894a; border-radius: 6px 0 0 6px; color: #c2601a; font-weight: 500; margin: 8px 0; direction: ltr; }
    .card-body p.principle { background: rgba(21,128,61,.07); border-right: 3px solid var(--green); border-radius: 6px 0 0 6px; padding: 8px 14px; color: #15803d; font-size: 14px; margin: 8px 0; }
    .card-divider { height: 1px; background: var(--border); margin: 12px 0; }
    .complexity-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .complexity-pill { font-family: var(--font-mono); font-size: 11px; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); color: var(--text-muted); background: var(--bg-hover); }

    /* FLASHCARDS */
    .flashcards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .flashcard { height: 230px; perspective: 1000px; cursor: pointer; }
    .flashcard-inner { position: relative; width: 100%; height: 100%; transition: transform .55s cubic-bezier(.4,0,.2,1); transform-style: preserve-3d; }
    .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius-lg); padding: 22px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .flashcard-front { background: var(--bg-card); border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .fc-term { font-family: var(--font-serif); font-size: 20px; font-weight: 600; color: var(--accent); text-align: center; margin-bottom: 10px; }
    .fc-hint { font-size: 11px; color: var(--text-dim); }
    .flashcard-back { background: var(--bg-panel); border: 2px solid var(--accent); transform: rotateY(180deg); justify-content: flex-start; align-items: flex-start; overflow-y: auto; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .fc-body { font-size: 14px; line-height: 1.7; color: var(--text-muted); text-align: right; width: 100%; }
    .fc-body strong { color: var(--text); }
    .fc-body sub, .fc-body sup { font-size: .72em; }
    .fc-body p { margin-bottom: 6px; }
    .fc-body p:last-child { margin-bottom: 0; }
    .fc-body p.formula { font-family: var(--font-mono); font-size: 12px; background: #fff0e4; border-right: 3px solid #e8894a; border-radius: 4px 0 0 4px; padding: 5px 10px; color: #c2601a; margin: 4px 0; direction: ltr; text-align: center; }
    .fc-body p.principle { background: rgba(21,128,61,.07); border-right: 3px solid var(--green); border-radius: 4px 0 0 4px; padding: 5px 10px; color: #15803d; font-size: 13px; margin: 4px 0; }

    /* PDF */
    #pdf-frame { width: 100%; height: 100%; border: none; display: block; }

    /* EMPTY */
    #empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--text-dim); }
    #empty-state svg { opacity: .3; }
    #empty-state p { font-size: 14px; }
    mark { background: rgba(180,83,9,.2); color: var(--amber); border-radius: 2px; }

    /* ── BOTTOM NAV (mobile only) ── */
    #bottom-nav { display: none; }

    @media (max-width: 640px) {
      :root { --topbar-h: 52px; }
      body { padding-bottom: 64px; }

      /* topbar */
      #topbar { padding: 0 12px; gap: 10px; }
      #hamburger { display: none; }
      #topbar-search { max-width: none; flex: 1; }
      #search-input { font-size: 14px; padding: 6px 10px; }
      #live-clock { display: none; }

      /* sidebar — hidden on mobile, replaced by bottom nav */
      #sidebar { display: none; }

      /* main takes full width */
      #main { width: 100%; }

      /* header */
      #course-header { padding: 10px 14px 0; }
      #course-title { font-size: 15px; }
      #course-title-bar { margin-bottom: 8px; }
      .view-toggle-btn { padding: 5px 9px; font-size: 11px; }

      /* content */
      #content-area { padding: 14px; }

      /* cards */
      .content-card { padding: 14px 16px; }
      .card-title { font-size: 13px; }
      .card-body { font-size: 14px; }
      .card-body p.formula { font-size: 12px; padding: 8px 10px; }

      /* flashcards */
      .flashcards-grid { grid-template-columns: 1fr; gap: 14px; }
      .flashcard { height: 210px; }
      .fc-term { font-size: 17px; }

      /* bottom nav */
      #bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: 64px;
        background: var(--bg-panel);
        border-top: 1px solid var(--border);
        z-index: 50;
        box-shadow: 0 -2px 12px rgba(0,0,0,.08);
      }
      .bnav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        cursor: pointer;
        border: none;
        background: transparent;
        color: var(--text-dim);
        font-family: var(--font-ui);
        font-size: 10px;
        font-weight: 500;
        transition: color .15s, background .15s;
        padding: 6px 4px;
      }
      .bnav-item .bnav-icon { font-size: 20px; line-height: 1; }
      .bnav-item.active { color: var(--accent); background: var(--accent-bg); }
    }
  </style>
</head>
<body>

<div id="topbar">
  <div class="logo">🧮 CS Summaries<small>by Yuli Ittah</small></div>
  <div id="topbar-search">
    <input type="text" id="search-input" placeholder="חיפוש בכל הסיכומים..." />
  </div>
  <div id="live-clock" style="font-size:13px;color:var(--text-muted);text-align:left;line-height:1.4;margin-right:auto;"></div>
</div>

<div id="bottom-nav"></div>

<div id="layout">
  <div id="sidebar">
    <div class="sidebar-label">קורסים</div>
    <div id="course-list"></div>
  </div>
  <div id="main">
    <div id="course-header">
      <div id="course-title-bar">
        <div id="course-title">בחר קורס</div>
        <div id="course-subtitle"></div>
      </div>
      <div id="topic-tabs"></div>
    </div>
    <div id="content-area">
      <div id="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/>
        </svg>
        <p>בחר קורס מהתפריט</p>
      </div>
    </div>
  </div>
</div>

<script>
const COURSES = {

  linear1: {
    name: "אלגברה לינארית 1", icon: "📐",
    pdfs: [
      { label: "סיכום 1", file: "linear-note1.pdf" },
      { label: "סיכום 2", file: "linear-note2.pdf" },
    ],
    cards: [
      {
        title: "מרחב וקטורי",
        tags: [{ label: "הגדרה", color: "blue" }],
        text: `<p>קבוצה V עם פעולות חיבור וכפל בסקלר מעל שדה F, המקיימת <strong>8 אקסיומות</strong>: סגירות, קומוטטיביות, אסוציאטיביות, איבר אפס, נגדי, ניטרל כפל, דיסטריבוטיביות (×2).</p>
        <p class="principle">⚡ כדי להוכיח שV הוא מרחב וקטורי — בדקי את כל 8 האקסיומות.</p>`
      },
      {
        title: "תת-מרחב וקטורי",
        tags: [{ label: "הגדרה", color: "blue" }],
        text: `<p>W⊆V הוא תת-מרחב אם: <strong>1.</strong> 0∈W &nbsp;&nbsp; <strong>2.</strong> סגור לחיבור &nbsp;&nbsp; <strong>3.</strong> סגור לכפל בסקלר.</p>
        <p class="principle">⚡ קפיצה: אם W≠∅ וסגור לפעולות — הוא תת-מרחב.</p>`
      },
      {
        title: "בסיס וקואורדינטות",
        tags: [{ label: "הגדרה", color: "blue" }, { label: "מבחן", color: "green" }],
        text: `<p>B = {v<sub>1</sub>,...,v<sub>n</sub>} הוא <strong>בסיס</strong> של V אם פורש אותו ובלתי תלוי לינארית (ב"ת).</p>
        <p class="formula">[v]<sub>B</sub> = (a<sub>1</sub>,...,a<sub>n</sub>)<sup>T</sup>  כאשר  v = a<sub>1</sub>v<sub>1</sub>+...+a<sub>n</sub>v<sub>n</sub></p>
        <p class="principle">⚡ "משפט שלישי חינם": במרחב ממימד n — כל n איברים ב"ת הם בסיס!</p>`
      },
      {
        title: "תלות ובלתי תלות לינארית",
        tags: [{ label: "הגדרה", color: "blue" }],
        text: `<p><strong>ב"ת לינארית</strong>: a<sub>1</sub>v<sub>1</sub>+...+a<sub>n</sub>v<sub>n</sub>=0 גורר a<sub>i</sub>=0 לכל i.</p>
        <p><strong>ת"ל לינארית</strong>: קיים צירוף לא טריוויאלי שמניב אפס.</p>
        <p class="principle">⚡ n+1 וקטורים במרחב n-מימדי תמיד תלויים לינארית!</p>`
      },
      {
        title: "שינוי בסיס — מטריצת המעבר",
        tags: [{ label: "חשוב", color: "amber" }, { label: "מבחן", color: "green" }],
        text: `<p>עמודה j של [I]<sub>B</sub><sup>C</sup> היא [v<sub>j</sub>]<sub>C</sub>.</p>
        <p class="formula">[v]<sub>C</sub> = [I]<sub>B</sub><sup>C</sup> · [v]<sub>B</sub></p>
        <p class="formula">([I]<sub>B</sub><sup>C</sup>)<sup>-1</sup> = [I]<sub>C</sub><sup>B</sup></p>`
      },
      {
        title: "העתקה לינארית",
        tags: [{ label: "הגדרה", color: "blue" }],
        text: `<p>T: V→U לינארית אם לכל u,v∈V וסקלר λ:</p>
        <p class="formula">T(u+v) = T(u) + T(v)</p>
        <p class="formula">T(λv) = λ·T(v)</p>
        <p>נובע: T(0)=0, T(Σa<sub>i</sub>v<sub>i</sub>) = Σa<sub>i</sub>T(v<sub>i</sub>)</p>`
      },
      {
        title: "גרעין ותמונה",
        tags: [{ label: "חשוב", color: "amber" }, { label: "מבחן", color: "green" }],
        text: `<p><strong>Ker(T)</strong> = {v∈V | T(v)=0} — תת-מרחב של V.</p>
        <p><strong>Im(T)</strong> = {T(v) | v∈V} — תת-מרחב של U.</p>
        <p class="formula">dim Ker(T) + dim Im(T) = dim V</p>
        <p class="principle">⚡ משפט הדרגה: תמיד נכון. שימושי להוכחת חח"ע / על.</p>`
      },
      {
        title: "חח\"ע, על, ואיזומורפיזם",
        tags: [{ label: "חשוב", color: "amber" }],
        text: `<p><strong>T חח"ע</strong> ↔ Ker(T) = {0}</p>
        <p><strong>T על</strong> ↔ Im(T) = U</p>
        <p><strong>איזומורפיזם</strong>: חח"ע + על. תנאי הכרחי ומספיק: dim V = dim U.</p>`
      },
      {
        title: "מטריצה מייצגת",
        tags: [{ label: "הגדרה", color: "blue" }, { label: "מבחן", color: "green" }],
        text: `<p>עמודה j של [T]<sub>B</sub><sup>C</sup> היא [T(v<sub>j</sub>)]<sub>C</sub>.</p>
        <p class="formula">[T(v)]<sub>C</sub> = [T]<sub>B</sub><sup>C</sup> · [v]<sub>B</sub></p>
        <p class="formula">[S∘T]<sub>B</sub><sup>D</sup> = [S]<sub>C</sub><sup>D</sup> · [T]<sub>B</sub><sup>C</sup></p>
        <p class="formula">([T]<sub>B</sub><sup>C</sup>)<sup>-1</sup> = [T<sup>-1</sup>]<sub>C</sub><sup>B</sup></p>`
      },
      {
        title: "משפט המימדים",
        tags: [{ label: "עיקרון", color: "purple" }],
        text: `<p>לתתי-מרחבים U,W של V:</p>
        <p class="formula">dim(U+W) = dim U + dim W - dim(U∩W)</p>
        <p class="principle">⚡ בדיוק כמו |A∪B| = |A|+|B|-|A∩B| — כלל ההכלה-הדחה.</p>`
      },
    ]
  },

  infi1: {
    name: "חשבון אינפיניטסימלי 1", icon: "∞",
    pdfs: [{ label: "סיכום", file: "infi-1.pdf" }],
    cards: [
      {
        title: "גבול סדרה — ε-N",
        tags: [{ label: "הגדרה", color: "blue" }],
        text: `<p>סדרה (a<sub>n</sub>) מתכנסת ל-L אם לכל ε>0 קיים N כך שלכל n>N:</p>
        <p class="formula">|a<sub>n</sub> - L| &lt; ε</p>
        <p class="principle">⚡ "ε-N": נותנים ε (דיוק רצוי) → מוצאים N (מקום התחלה). ממנו הסדרה קרובה ללא הגבלה.</p>`
      },
      {
        title: "כלל הסנדוויץ'",
        tags: [{ label: "חשוב", color: "amber" }],
        text: `<p>אם a<sub>n</sub> ≤ b<sub>n</sub> ≤ c<sub>n</sub> ו-a<sub>n</sub>,c<sub>n</sub> → L, אז b<sub>n</sub> → L.</p>

        <p class="principle">⚡ כלל: Abstract כשיש קוד משותף. Interface כשרוצים גמישות ויכולות.</p>`
      },
      {
        title: "Encapsulation — כימוס",
        tags: [{ label: "עיקרון", color: "purple" }],
        text: `<p>הסתרת פרטי המימוש. שדות <code>private</code> + גישה דרך <code>getter/setter</code>.</p>
        <p class="principle">⚡ מבטיח שלמות נתונים ומאפשר שינוי מימוש פנימי בלי לשבור קוד חיצוני.</p>`
      },
      {
        title: "Generics — גנריות",
        tags: [{ label: "חשוב", color: "amber" }],
        text: `<p>כתיבת קוד שעובד עם כל טיפוס. בטיחות טיפוסים בזמן קומפילציה.</p>
        <p class="formula">class Box&lt;T&gt; { T value; }</p>
        <p class="formula">Box&lt;Integer&gt; b = new Box&lt;&gt;();</p>
        <p class="principle">⚡ Type Erasure: בזמן ריצה כל הגנריות הופכות ל-Object.</p>`
      },
      {
        title: "Exception Handling",
        tags: [{ label: "חשוב", color: "amber" }],
        text: `<p><strong>Checked:</strong> חייב try-catch או throws. דוגמה: IOException.</p>
        <p><strong>Unchecked (RuntimeException):</strong> לא חייב לטפל. דוגמה: NullPointerException.</p>
        <p class="formula">try { } catch(Exception e) { } finally { }</p>
        <p class="principle">⚡ <code>finally</code> תמיד מופעל — גם אחרי Exception!</p>`
      },
      {
        title: "עקרון SOLID",
        tags: [{ label: "עיקרון", color: "purple" }],
        text: `<p><strong>S</strong>ingle Responsibility — מחלקה = אחריות אחת.</p>
        <p><strong>O</strong>pen/Closed — פתוחה להרחבה, סגורה לשינוי.</p>
        <p><strong>L</strong>iskov — הבת חייבת לעמוד בחוזה האם.</p>
        <p><strong>I</strong>nterface Segregation — ממשקים קטנים וממוקדים.</p>
        <p><strong>D</strong>ependency Inversion — תלות על abstractions, לא מימושים.</p>`
      },
      {
        title: "Garbage Collector",
        tags: [{ label: "הגדרה", color: "blue" }],
        text: `<p>מנגנון ב-JVM שמשחרר זיכרון אוטומטית. אובייקט נאסף כשאין יותר רפרנסים אליו.</p>
        <p class="principle">⚡ ב-Java אין <code>free()</code> ידני. הGC מחליט מתי לפנות. אין ערובה על מועד האיסוף.</p>`
      },
    ]
  }
};

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let activeCourse = null;
let viewMode = 'cards';
let activePdfIndex = 0;
let searchQuery = '';
const pdfBlobUrls = {};

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function highlight(text) {
  if (!searchQuery) return text;
  return text.replace(new RegExp(`(${esc(searchQuery)})`,'gi'),'<mark>$1</mark>');
}
function tagHTML(tag) {
  const map = {blue:'tag-blue',green:'tag-green',amber:'tag-amber',red:'tag-red',purple:'tag-purple'};
  return `<span class="tag ${map[tag.color]||'tag-blue'}">${tag.label}</span>`;
}
function totalCards() { return Object.values(COURSES).reduce((s,c)=>s+c.cards.length,0); }

// ═══════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════
function renderSidebar() {
  const list = document.getElementById('course-list');
  list.innerHTML = '';
  let n = 0;
  Object.entries(COURSES).forEach(([id, course]) => {
    if (searchQuery) {
      const hit = course.name.includes(searchQuery) ||
        course.cards.some(c => c.title.includes(searchQuery) || c.text.includes(searchQuery));
      if (!hit) return;
    }
    n++;
    const item = document.createElement('div');
    item.className = 'course-item' + (activeCourse === id ? ' active' : '');
    item.innerHTML = `<span>${course.icon}</span>${course.name}<span class="course-count">${course.cards.length}</span>`;
    item.onclick = () => selectCourse(id);
    list.appendChild(item);
  });
  document.getElementById('stat-courses') && (document.getElementById('stat-courses').textContent = `${n} קורסים`);
  document.getElementById('stat-cards') && (document.getElementById('stat-cards').textContent = `${totalCards()} כרטיסיות`);
}

// ═══════════════════════════════════════
// SELECT
// ═══════════════════════════════════════
function renderBottomNav() {
  const nav = document.getElementById('bottom-nav');
  if (!nav) return;
  nav.innerHTML = Object.entries(COURSES).map(([id, course]) => `
    <button class="bnav-item ${activeCourse === id ? 'active' : ''}" onclick="selectCourse('${id}')">
      <span class="bnav-icon">${course.icon}</span>
      <span>${course.name.split(' ').slice(-2).join(' ')}</span>
    </button>`).join('');
}

function selectCourse(id) {
  activeCourse = id;
  activePdfIndex = 0;
  const c = COURSES[id];
  viewMode = (c.pdfs && c.pdfs.length > 0) ? 'pdf' : 'cards';
  render();
}

// ═══════════════════════════════════════
// HEADER
// ═══════════════════════════════════════
function renderMain() {
  const titleEl = document.getElementById('course-title');
  const subtitleEl = document.getElementById('course-subtitle');
  const tabsEl = document.getElementById('topic-tabs');
  const contentEl = document.getElementById('content-area');

  if (!activeCourse) {
    titleEl.textContent = 'בחר קורס';
    subtitleEl.textContent = '';
    tabsEl.innerHTML = '';
    contentEl.style.padding = '24px';
    contentEl.innerHTML = `<div id="empty-state">
      <div style="font-size:64px;margin-bottom:8px">📚</div>
      <p>בחר קורס מהתפריט</p>
      <p style="font-size:12px;color:var(--text-dim);margin-top:4px">4 קורסים · ${totalCards()} כרטיסיות</p>
    </div>`;
    return;
  }

  const course = COURSES[activeCourse];
  titleEl.textContent = `${course.icon} ${course.name}`;
  subtitleEl.textContent = `${course.cards.length} כרטיסיות`;
  tabsEl.innerHTML = '';

  // Toggle
  const toggle = document.createElement('div');
  toggle.className = 'view-toggle';

  if (course.pdfs && course.pdfs.length > 0) {
    const b = document.createElement('button');
    b.className = 'view-toggle-btn' + (viewMode==='pdf'?' active':'');
    b.textContent = '📄 PDF';
    b.onclick = () => { viewMode='pdf'; renderMain(); };
    toggle.appendChild(b);
  }

  [['🗂 הגדרות','cards'],['🔁 Flashcards','flashcards']].forEach(([label, mode]) => {
    const b = document.createElement('button');
    b.className = 'view-toggle-btn' + (viewMode===mode?' active':'');
    b.textContent = label;
    b.onclick = () => { viewMode=mode; renderMain(); };
    toggle.appendChild(b);
  });

  tabsEl.appendChild(toggle);

  // PDF sub-tabs
  if (viewMode === 'pdf' && course.pdfs.length > 1) {
    course.pdfs.forEach((p, i) => {
      const tab = document.createElement('button');
      tab.className = 'topic-tab' + (activePdfIndex===i?' active':'');
      tab.textContent = p.label;
      tab.onclick = () => {
        activePdfIndex = i;
        document.querySelectorAll('.topic-tab').forEach((t,j)=>t.className='topic-tab'+(j===i?' active':''));
        renderContent();
      };
      tabsEl.appendChild(tab);
    });
  }

  renderContent();
}

// ═══════════════════════════════════════
// CONTENT
// ═══════════════════════════════════════
function renderContent() {
  const contentEl = document.getElementById('content-area');
  const course = COURSES[activeCourse];

  // PDF mode
  if (viewMode === 'pdf') {
    if (!course.pdfs || course.pdfs.length === 0) { viewMode='cards'; renderMain(); return; }
    const entry = course.pdfs[activePdfIndex];
    const key = `${activeCourse}:${activePdfIndex}`;
    contentEl.style.padding = '0';

    if (pdfBlobUrls[key]) {
      contentEl.innerHTML = `<iframe id="pdf-frame" src="${pdfBlobUrls[key]}" title="${entry.label}"></iframe>`;
    } else if (location.protocol !== 'file:') {
      contentEl.innerHTML = `<iframe id="pdf-frame" src="${entry.file}" title="${entry.label}"></iframe>`;
    } else {
      contentEl.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="1.3">
            <path d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m.75 12l3 3m0 0l3-3m-3 3v-6m-1.5-9H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
          </svg>
          <p style="font-size:14px;color:var(--text-muted);">${entry.label}</p>
          <button id="pick-pdf-btn" style="padding:9px 22px;border-radius:var(--radius);border:none;background:var(--accent);color:#fff;font-family:var(--font-ui);font-size:13px;cursor:pointer;">📂 בחר קובץ PDF</button>
          <input type="file" id="pdf-file-input" accept=".pdf" style="display:none"/>
          <p style="font-size:11px;color:var(--text-dim);">הקובץ לא עולה לשום מקום</p>
        </div>`;
      document.getElementById('pick-pdf-btn').onclick = () => document.getElementById('pdf-file-input').click();
      document.getElementById('pdf-file-input').onchange = e => {
        const f = e.target.files[0]; if (!f) return;
        pdfBlobUrls[key] = URL.createObjectURL(f);
        renderContent();
      };
    }
    return;
  }

  contentEl.style.padding = '24px';
  const cards = course.cards.filter(c =>
    !searchQuery || c.title.includes(searchQuery) || c.text.includes(searchQuery)
  );

  if (cards.length === 0) {
    contentEl.innerHTML = `<div id="empty-state"><p>אין תוצאות לחיפוש "${searchQuery}"</p></div>`;
    return;
  }

  // FLASHCARDS
  if (viewMode === 'flashcards') {
    contentEl.innerHTML = `
      <div style="text-align:center;margin-bottom:20px;color:var(--text-dim);font-size:13px">
        🔁 לחצי על כרטיס לגילוי ההגדרה · ${cards.length} מושגים
      </div>
      <div class="flashcards-grid">` + cards.map(card => `
      <div class="flashcard" onclick="this.classList.toggle('flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-front">
            <div style="font-size:28px;margin-bottom:8px">${COURSES[activeCourse].icon}</div>
            <div class="fc-term">${highlight(card.title)}</div>
            <div class="fc-hint">לחצי לגילוי ההגדרה 🔄</div>
          </div>
          <div class="flashcard-back">
            <div class="fc-body">${highlight(card.text)}</div>
          </div>
        </div>
      </div>`).join('') + `</div>`;
    return;
  }

  // CARDS
  contentEl.innerHTML = cards.map(card => {
    const tags = (card.tags||[]).map(tagHTML).join('');
    const pills = (card.complexity||[]).map(c=>`<span class="complexity-pill">${c}</span>`).join('');
    return `<div class="content-card">
      <div class="card-header">
        <div class="card-title">${highlight(card.title)}</div>
        <div class="card-tags">${tags}</div>
      </div>
      <div class="card-body">${highlight(card.text)}</div>
      ${pills?`<div class="card-divider"></div><div class="complexity-row">${pills}</div>`:''}
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
function render() { renderSidebar(); renderMain(); renderBottomNav(); }

function updateClock() {
  const now = new Date();
  const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const day = days[now.getDay()];
  const date = now.toLocaleDateString('he-IL', { day:'2-digit', month:'2-digit', year:'numeric' });
  const time = now.toLocaleTimeString('he-IL', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  const el = document.getElementById('live-clock');
  if (el) el.innerHTML = `<span style="font-weight:600;color:var(--text)">${time}</span><br><span style="font-size:11px">יום ${day} · ${date}</span>`;
}
updateClock();
setInterval(updateClock, 1000);

document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderSidebar();
  if (activeCourse) renderContent();
});

render();
</script>
</body>
</html>
