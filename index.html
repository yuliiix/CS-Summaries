<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS Summaries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Assistant:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ========== RESET & TOKENS (RESTORED) ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fdfbf0; --bg-panel: #faf6e0; --bg-card: #ffffff; --bg-hover: #f5eecc;
      --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.15);
      --text: #1c1917; --text-muted: #78716c; --text-dim: #b5a98e;
      --accent: #1d4ed8; --accent-bg: rgba(29,78,216,0.08);
      --sidebar-w: 240px; --topbar-h: 56px; --radius: 8px; --radius-lg: 12px;
      --font-ui: 'Assistant', sans-serif; --font-mono: 'JetBrains Mono', monospace; --font-serif: 'Noto Serif Hebrew', serif;
    }
    body { font-family: var(--font-ui); background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ========== TOP BAR ========== */
    #topbar { height: var(--topbar-h); background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0; z-index: 10; }
    .logo { font-family: var(--font-serif); font-size: 15px; font-weight: 600; white-space: nowrap; display: flex; flex-direction: column; }
    .logo small { font-size: 10px; color: var(--text-dim); }
    #topbar-search { flex: 1; max-width: 340px; position: relative; }
    #search-input { width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 14px; font-size: 13px; outline: none; }
    .emoji-row { display: flex; gap: 15px; font-size: 20px; margin-right: auto; }

    /* ========== LAYOUT ========== */
    #layout { display: flex; flex: 1; overflow: hidden; }
    #sidebar { width: var(--sidebar-w); background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
    #course-list { overflow-y: auto; flex: 1; padding: 4px 8px; }
    .course-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius); cursor: pointer; color: var(--text-muted); font-size: 13px; margin-bottom: 2px; }
    .course-item.active { background: var(--accent-bg); color: var(--accent); }
    .course-count { margin-right: auto; font-size: 10px; background: var(--bg-card); padding: 1px 6px; border-radius: 10px; }

    /* ========== CONTENT AREA (ORANGE FORMULAS) ========== */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #course-header { background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 14px 24px 0; }
    #course-title { font-family: var(--font-serif); font-size: 18px; font-weight: 600; margin-bottom: 12px; }
    #topic-tabs { display: flex; gap: 2px; }
    #content-area { flex: 1; overflow-y: auto; padding: 24px; }

    .content-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 22px; margin-bottom: 14px; }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .card-title { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--text); }
    .tag { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; }
    .tag-blue { background: var(--accent-bg); color: var(--accent); }
    .card-body { font-size: 15px; line-height: 1.85; color: var(--text-muted); }
    
    /* הנוסחאות הכתומות שביקשת */
    .card-body p.formula {
      font-family: var(--font-mono); font-size: 15px; text-align: center; padding: 9px 16px;
      background: #fff0e4; border-right: 3px solid #e8894a; border-radius: 6px 0 0 6px;
      color: #c2601a; font-weight: 500; margin: 6px 0; direction: ltr;
    }
    
    .complexity-pill { font-family: var(--font-mono); font-size: 11px; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-hover); margin-left: 5px; }

    /* ========== FLASHCARDS (HIDDEN BY DEFAULT) ========== */
    .flashcards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .flashcard { background: transparent; height: 220px; perspective: 1000px; cursor: pointer; }
    .flashcard-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
    .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius-lg); padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; justify-content: center; align-items: center; }
    .flashcard-front { background: var(--bg-card); border: 1px solid var(--border); color: var(--accent); font-family: var(--font-mono); font-size: 18px; font-weight: 600; }
    .flashcard-back { background: var(--bg-panel); border: 2px solid var(--accent); transform: rotateY(180deg); font-size: 14px; overflow-y: auto; text-align: right; }

    .view-toggle { display: flex; gap: 2px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px; margin-right: auto; margin-bottom: 10px; width: fit-content; }
    .view-toggle-btn { padding: 4px 12px; border: none; background: transparent; border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--text-muted); }
    .view-toggle-btn.active { background: var(--bg-hover); color: var(--text); }
    #pdf-frame { width: 100%; height: 100%; border: none; background: #525659; }
    mark { background: rgba(210,153,34,0.25); color: var(--amber); }
  </style>
</head>
<body>

  <div id="topbar">
    <div class="logo">CS Summaries<small>by Yuli Ittah</small></div>
    <div id="topbar-search"><input type="text" id="search-input" placeholder="חיפוש בכל הסיכומים..." /></div>
    <div class="emoji-row"><span>🎓</span><span>📝</span><span>💻</span><span>🧠</span><span>💡</span><span>📖</span></div>
  </div>

  <div id="layout">
    <div id="sidebar"><div id="course-list"></div></div>
    <div id="main">
      <div id="course-header">
        <div id="course-title">בחר קורס</div>
        <div id="topic-tabs"></div>
      </div>
      <div id="content-area"></div>
    </div>
  </div>

  <script>
    const COURSES = {
      linear1: {
        name: "אלגברה לינארית 1", icon: "📐",
        pdfs: [{ label: "סיכום", file: "linear-note1.pdf" }],
        content: [
          { title: "בסיס וקואורדינטות", tags: [{label:"הגדרה"}], text: `<p>קבוצה <strong>B</strong> היא בסיס אם היא פורשת ובת"ל.</p><p class="formula">[v]<sub>B</sub> = (a<sub>1</sub>,...,a<sub>n</sub>)<sup>T</sup></p>` },
          { title: "שינוי בסיס", tags: [{label:"מבחן"}], text: `<p class="formula">[v]<sub>C</sub> = [I]<sub>B</sub><sup>C</sup> · [v]<sub>B</sub></p>` },
          { title: "העתקה לינארית", tags: [{label:"הגדרה"}], text: `<p class="formula">T(u+v) = T(u) + T(v)</p><p class="formula">T(λv) = λ·T(v)</p>` },
          { title: "משפט הדרגה", tags: [{label:"משפט"}], text: `<p class="formula">dim(Ker(T)) + dim(Im(T)) = dim(V)</p>` }
        ]
      },
      infi1: {
        name: "חשבון אינפיניטסימלי 1", icon: "∞",
        pdfs: [{ label: "סיכום", file: "infi-1.pdf" }],
        content: [
          { title: "גבול סדרה", tags: [{label:"הגדרה"}], text: `<p>לכל ε>0 קיים N כך שלכל n>N מתקיים |a<sub>n</sub>-L|<ε.</p>` },
          { title: "המספר e", tags: [{label:"מבחן"}], text: `<p class="formula">e = lim (1 + 1/n)<sup>n</sup></p>` },
          { title: "נגזרת", tags: [{label:"הגדרה"}], text: `<p class="formula">f'(a) = lim<sub>h→0</sub> [f(a+h)-f(a)]/h</p>` },
          { title: "כלל השרשרת", tags: [{label:"חשוב"}], text: `<p class="formula">(f∘g)'(x) = f'(g(x))·g'(x)</p>` }
        ]
      },
      ds: {
        name: "מבני נתונים", icon: "🌳",
        pdfs: [{ label: "סיכום", file: "סיכום מבני נתונים.pdf" }],
        content: [
          { title: "סיבוכיות זמן (O)", tags: [{label:"הגדרה"}], text: `<p>חסם עליון לקצב הגידול.</p><p class="formula">f(n) \in O(g(n)) \iff f(n) \le c \cdot g(n)</p>` },
          { title: "מחסנית ותור", tags: [{label:"בסיסי"}], text: `<p>מחסנית (LIFO) ותור (FIFO). פעולות ב-O(1).</p>`, complexity: ["O(1)"] },
          { title: "עץ AVL", tags: [{label:"עצים"}], text: `<p>עץ חיפוש בינארי מאוזן. גורם איזון (BF) בין 1 ל-(-1).</p><p class="formula">BF = h(Left) - h(Right)</p>`, complexity: ["O(log n)"] },
          { title: "סיבוכיות חיפוש", tags: [{label:"חשוב"}], text: `<p>מערך: O(n), ממוין: O(log n), רשימה: O(n), AVL: O(log n).</p>` }
        ]
      },
      oop: {
        name: "מונחי עצמים", icon: "☕",
        pdfs: [{ label: "סיכום", file: "סיכום מונחי עצמים.pdf" }],
        content: [
          { title: "Heap vs Stack", tags: [{label:"זיכרון"}], text: `<p>Stack למשתנים מקומיים ורפרנסים, Heap לאובייקטים (new).</p>` },
          { title: "כימוס (Encapsulation)", tags: [{label:"עקרון"}], text: `<p>הסתרת מידע ע"י private וחשיפה ע"י Getters/Setters.</p>` },
          { title: "פולימורפיזם", tags: [{label:"עקרון"}], text: `<p>שימוש ברפרנס אב לאובייקט בן. קישור דינמי בזמן ריצה.</p>` },
          { title: "גנריות (Generics)", tags: [{label:"Java"}], text: `<p>שימוש ב-Type Parameters לכתיבת קוד גמיש.</p><p class="formula">class Box&lt;T&gt; { T content; }</p>` }
        ]
      }
    };

    let activeCourse = null, viewMode = 'cards', searchQuery = '';
    const pdfBlobUrls = {};

    function selectCourse(id) { activeCourse = id; viewMode = 'cards'; render(); }
    
    function highlight(text) {
      if (!searchQuery) return text;
      const re = new RegExp(`(${searchQuery.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&')})`, 'gi');
      return text.replace(re, '<mark>$1</mark>');
    }

    function renderSidebar() {
      const list = document.getElementById('course-list'); list.innerHTML = '';
      Object.entries(COURSES).forEach(([id, c]) => {
        const item = document.createElement('div');
        item.className = 'course-item' + (activeCourse === id ? ' active' : '');
        item.innerHTML = `<span>${c.icon}</span>${c.name}<span class="course-count">${c.content.length}</span>`;
        item.onclick = () => selectCourse(id);
        list.appendChild(item);
      });
    }

    function renderMain() {
      const titleEl = document.getElementById('course-title'), tabsEl = document.getElementById('topic-tabs');
      if (!activeCourse) return;
      const course = COURSES[activeCourse];
      titleEl.textContent = `${course.icon} ${course.name}`;
      
      tabsEl.innerHTML = `
        <div class="view-toggle">
          ${course.pdfs ? `<button class="view-toggle-btn ${viewMode === 'pdf' ? 'active' : ''}" onclick="viewMode='pdf';renderMain()">📄 PDF</button>` : ''}
          <button class="view-toggle-btn ${viewMode === 'cards' ? 'active' : ''}" onclick="viewMode='cards';renderMain()">🗂 כרטיסיות</button>
          <button class="view-toggle-btn ${viewMode === 'flashcards' ? 'active' : ''}" onclick="viewMode='flashcards';renderMain()">🔁 Flashcards</button>
        </div>`;
      renderContent();
    }

    function renderContent() {
      const contentEl = document.getElementById('content-area'), course = COURSES[activeCourse];
      if (viewMode === 'pdf') {
        const entry = course.pdfs[0]; contentEl.style.padding = '0';
        if (location.protocol !== 'file:') { contentEl.innerHTML = `<iframe id="pdf-frame" src="${entry.file}"></iframe>`; }
        else {
          contentEl.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;">
            <button onclick="document.getElementById('p-in').click()" style="padding:10px 20px; border-radius:8px; border:none; background:var(--accent); color:#fff; cursor:pointer;">📂 בחר קובץ PDF</button>
            <input type="file" id="p-in" accept=".pdf" style="display:none" onchange="const f=this.files[0]; if(f){contentEl.innerHTML = '<iframe id=\\'pdf-frame\\' src=\\''+URL.createObjectURL(f)+'\\'></iframe>';}" />
          </div>`;
        }
        return;
      }
      const cards = course.content.filter(c => c.title.includes(searchQuery) || c.text.includes(searchQuery));
      contentEl.style.padding = '24px';
      if (viewMode === 'flashcards') {
        contentEl.innerHTML = `<div class="flashcards-container">` + cards.map(c => `
          <div class="flashcard" onclick="this.classList.toggle('flipped')">
            <div class="flashcard-inner">
              <div class="flashcard-front">${highlight(c.title)}</div>
              <div class="flashcard-back"><div>${highlight(c.text)}</div></div>
            </div>
          </div>`).join('') + `</div>`;
      } else {
        contentEl.innerHTML = cards.map(c => `
          <div class="content-card">
            <div class="card-header"><div class="card-title">${highlight(c.title)}</div><div class="card-tags">${(c.tags||[]).map(t=>'<span class="tag tag-blue">'+t.label+'</span>').join('')}</div></div>
            <div class="card-body">${highlight(c.text)}</div>
            ${(c.complexity||[]).length ? '<div style="margin-top:12px">'+c.complexity.map(p=>'<span class="complexity-pill">'+p+'</span>').join('')+'</div>' : ''}
          </div>`).join('');
      }
    }

    document.getElementById('search-input').oninput = (e) => { searchQuery = e.target.value; renderContent(); };
    function render() { renderSidebar(); renderMain(); }
    render();
  </script>
</body>
</html>
